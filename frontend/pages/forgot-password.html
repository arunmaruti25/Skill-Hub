<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-box">
        <a href="../index.html" class="logo"><img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34" style="width:34px;height:34px;object-fit:cover;border-radius:8px;display:inline-block;flex-shrink:0;"> Skill Hub</a>
        <h1>Reset Password</h1>
        <p>Enter your account email and new password</p>

        <form id="resetForm">
            <label for="resetEmail">Email Address</label>
            <input type="email" id="resetEmail" name="email" placeholder="you@example.com" required autocomplete="email">

            <label for="newPassword">New Password (min 6 characters)</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword" name="password" placeholder="Enter your new password" required minlength="6" autocomplete="new-password">
                <button type="button" class="toggle-password-btn" onclick="togglePassword('newPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="primary-btn" style="width:100%;height:46px;margin-top:4px;">
                <i class="fa-solid fa-key"></i> Update Password
            </button>
        </form>

        <p class="auth-link">Remembered your password? <a href="login.html">Sign in</a></p>
    </div>
</div>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("resetForm");
    form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("resetEmail").value.trim();
        const password = document.getElementById("newPassword").value;

        if (password.length < 6) {
            showToast("Password must be at least 6 characters long.", "warning");
            return;
        }

        const btn = form.querySelector("button[type='submit']");
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/api/reset-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const result = await res.json();

            if (res.ok) {
                showToast("Password updated successfully! You can now log in.", "success");
                setTimeout(() => window.location.href = "login.html", 1000);
            } else {
                showToast(result.message || "Could not reset password.", "error");
            }
        } catch (err) {
            showToast("Network error. Please try again.", "error");
        } finally {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    });
});
</script>
</body>
</html>
