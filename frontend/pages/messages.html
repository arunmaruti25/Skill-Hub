<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Messages - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .conversation-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--c-border);
            cursor: pointer;
            transition: var(--transition);
            background: var(--c-white);
        }
        .conversation-item:last-child {
            border-bottom: none;
        }
        .conversation-item:hover {
            background: #FAFCFE;
            transform: translateX(4px);
        }
        .conversation-info {
            flex: 1;
            min-width: 0;
        }
        .conversation-info h3 {
            margin: 0 0 4px;
            color: var(--c-dark);
            font-size: 15px;
            font-weight: 700;
        }
        .conversation-info p {
            margin: 0;
            color: var(--c-text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-time {
            font-size: 11.5px;
            color: var(--c-text-secondary);
            margin-bottom: 4px;
            text-align: right;
        }
        .unread-count-pill {
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            background: var(--c-primary);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <!-- Mobile Sticky Top Header (< 1024px) -->
    <header class="mobile-top-bar" id="mobileTopBar" aria-label="Mobile Navigation Bar">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="dashboard.html" class="mobile-logo">
            <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
            <span class="mobile-logo-text">Skill Hub</span>
        </a>
        <a href="profile.html" class="mobile-avatar-link" aria-label="View My Profile">
            <div id="mobileUserAvatar" class="avatar mobile-avatar">U</div>
        </a>
    </header>

    <!-- Mobile Drawer Overlay / Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Collapsible Sidebar / Off-Canvas Drawer -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
                <span class="logo-text">Skill Hub</span>
            </a>
            <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
                <i class="fa-solid fa-angles-left"></i>
            </button>
            <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close navigation menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav>
            <a href="dashboard.html" title="Dashboard" data-tooltip="Dashboard"><i class="fa-solid fa-house"></i> <span class="nav-label">Dashboard</span></a>
            <a href="teammates.html" title="Find Teammates" data-tooltip="Find Teammates"><i class="fa-solid fa-user-group"></i> <span class="nav-label">Find Teammates</span></a>
            <a href="projects.html" title="Projects" data-tooltip="Projects"><i class="fa-solid fa-folder"></i> <span class="nav-label">Projects</span></a>
            <a href="requests.html" title="Requests" data-tooltip="Requests"><i class="fa-solid fa-paper-plane"></i> <span class="nav-label">Requests</span><span id="requestBadge" class="sidebar-badge">0</span></a>
            <a href="notifications.html" title="Notifications" data-tooltip="Notifications"><i class="fa-solid fa-bell"></i> <span class="nav-label">Notifications</span><span id="notificationBadge" class="sidebar-badge">0</span></a>
            <a href="messages.html" class="active" title="Messages" data-tooltip="Messages"><i class="fa-solid fa-message"></i> <span class="nav-label">Messages</span><span id="messageBadge" class="sidebar-badge">0</span></a>
            <a href="admin.html" id="adminNavLink" style="display:none;" title="Admin Panel" data-tooltip="Admin Panel"><i class="fa-solid fa-shield-halved"></i> <span class="nav-label">Admin Panel</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html" title="My Profile" data-tooltip="My Profile"><i class="fa-solid fa-user"></i> <span class="nav-label">My Profile</span></a>
            <a href="javascript:void(0)" onclick="logout()" title="Logout" data-tooltip="Logout"><i class="fa-solid fa-right-from-bracket"></i> <span class="nav-label">Logout</span></a>
        </div>
    </aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Messages</h1>
            <p>Direct conversations with teammates and project collaborators.</p>
        </div>
        <a href="teammates.html" class="primary-btn"><i class="fa-solid fa-comment-dots"></i> Start New Chat</a>
    </div>

    <div class="dash-card" style="padding:0;overflow:hidden;">
        <div id="conversationsList">
            <p class="section-text" style="padding:30px 20px;color:var(--c-text-secondary);text-align:center;">Loading conversations...</p>
        </div>
    </div>
</main>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    loadConversations();
});

async function loadConversations() {
    const container = document.getElementById('conversationsList');
    try {
        const res = await authFetch('/api/messages/conversations');
        if (res && res.ok) {
            const conversations = await res.json();
            renderConversations(conversations);
            updateSidebarBadges();
        } else {
            container.innerHTML = '<p class="section-text" style="padding:30px 20px;color:var(--c-error);text-align:center;">Failed to load messages.</p>';
        }
    } catch (err) {
        console.error('loadConversations error:', err);
        container.innerHTML = '<p class="section-text" style="padding:30px 20px;color:var(--c-error);text-align:center;">Network error loading conversations.</p>';
    }
}

function renderConversations(conversations) {
    const container = document.getElementById('conversationsList');
    if (!conversations || !conversations.length) {
        container.innerHTML = `
            <div style="text-align:center;padding:60px 20px;">
                <i class="fa-solid fa-comments" style="font-size:48px;color:var(--c-border);margin-bottom:14px;display:block;"></i>
                <h3 style="color:var(--c-dark);margin-bottom:6px;">No conversations yet</h3>
                <p style="color:var(--c-text-secondary);margin-bottom:20px;">Connect with peers on the Find Teammates page to start collaborating.</p>
                <a href="teammates.html" class="primary-btn"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
            </div>
        `;
        return;
    }

    container.innerHTML = conversations.map(c => {
        const other = c.otherUser || c.user || {};
        const avatarHtml = other.profileImage
            ? `<img src="${other.profileImage.startsWith('http') ? other.profileImage : API_BASE_URL + other.profileImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
            : (other.name || 'U').charAt(0).toUpperCase();

        const lastText = typeof c.lastMessage === 'object' ? c.lastMessage?.content : (c.lastMessage || c.lastMessageText || 'Chat started');
        const timeText = c.lastMessageTime || c.lastMessage?.createdAt;

        return `
            <div class="conversation-item" onclick="location.href='chat.html?user=${other._id}'">
                <div class="avatar" style="width:48px;height:48px;font-size:16px;">${avatarHtml}</div>
                <div class="conversation-info">
                    <h3>${other.name || 'User'}</h3>
                    <p>${lastText}</p>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;">
                    ${timeText ? `<span class="conversation-time">${new Date(timeText).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>` : ''}
                    ${c.unreadCount > 0 ? `
                        <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
                            <span class="unread-count-pill">${c.unreadCount}</span>
                            <button class="outline-btn" style="padding:2px 8px;font-size:11px;" onclick="event.stopPropagation(); markConversationRead('${other._id}')">Mark as Read</button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `;
    }).join('');
}

async function markConversationRead(otherUserId) {
    const currentUser = getAuthUser();
    const currentUserId = currentUser.id || currentUser._id;
    try {
        const res = await authFetch(`/api/messages/read/${currentUserId}/${otherUserId}`, { method: 'PUT' });
        if (res && res.ok) {
            loadConversations();
        }
    } catch (e) {
        console.error('Error marking as read', e);
    }
}
</script>
</body>
</html>
