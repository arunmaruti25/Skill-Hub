<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Requests - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .request-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <!-- Mobile Sticky Top Header (< 1024px) -->
    <header class="mobile-top-bar" id="mobileTopBar" aria-label="Mobile Navigation Bar">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="dashboard.html" class="mobile-logo">
            <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
            <span class="mobile-logo-text">Skill Hub</span>
        </a>
        <a href="profile.html" class="mobile-avatar-link" aria-label="View My Profile">
            <div id="mobileUserAvatar" class="avatar mobile-avatar">U</div>
        </a>
    </header>

    <!-- Mobile Drawer Overlay / Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Collapsible Sidebar / Off-Canvas Drawer -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
                <span class="logo-text">Skill Hub</span>
            </a>
            <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
                <i class="fa-solid fa-angles-left"></i>
            </button>
            <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close navigation menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav>
            <a href="dashboard.html" title="Dashboard" data-tooltip="Dashboard"><i class="fa-solid fa-house"></i> <span class="nav-label">Dashboard</span></a>
            <a href="teammates.html" title="Find Teammates" data-tooltip="Find Teammates"><i class="fa-solid fa-user-group"></i> <span class="nav-label">Find Teammates</span></a>
            <a href="projects.html" title="Projects" data-tooltip="Projects"><i class="fa-solid fa-folder"></i> <span class="nav-label">Projects</span></a>
            <a href="requests.html" class="active" title="Requests" data-tooltip="Requests"><i class="fa-solid fa-paper-plane"></i> <span class="nav-label">Requests</span><span id="requestBadge" class="sidebar-badge">0</span></a>
            <a href="notifications.html" title="Notifications" data-tooltip="Notifications"><i class="fa-solid fa-bell"></i> <span class="nav-label">Notifications</span><span id="notificationBadge" class="sidebar-badge">0</span></a>
            <a href="messages.html" title="Messages" data-tooltip="Messages"><i class="fa-solid fa-message"></i> <span class="nav-label">Messages</span><span id="messageBadge" class="sidebar-badge">0</span></a>
            <a href="admin.html" id="adminNavLink" style="display:none;" title="Admin Panel" data-tooltip="Admin Panel"><i class="fa-solid fa-shield-halved"></i> <span class="nav-label">Admin Panel</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html" title="My Profile" data-tooltip="My Profile"><i class="fa-solid fa-user"></i> <span class="nav-label">My Profile</span></a>
            <a href="javascript:void(0)" onclick="logout()" title="Logout" data-tooltip="Logout"><i class="fa-solid fa-right-from-bracket"></i> <span class="nav-label">Logout</span></a>
        </div>
    </aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Project Join Requests</h1>
            <p>Review incoming requests for your projects and track applications you've sent.</p>
        </div>
    </div>

    <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
        <button class="primary-btn" onclick="loadRequests('received')" id="tabReceived"><i class="fa-solid fa-inbox"></i> Received Requests</button>
        <button class="outline-btn" onclick="loadRequests('sent')" id="tabSent"><i class="fa-solid fa-paper-plane"></i> Sent Requests</button>
    </div>

    <div id="requestsList">
        <p class="section-text" style="color:var(--c-text-secondary);">Loading requests...</p>
    </div>
</main>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
let currentTab = 'received';

document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    loadRequests('received');
});

async function loadRequests(type) {
    currentTab = type;
    document.getElementById('tabReceived').className = type === 'received' ? 'primary-btn' : 'outline-btn';
    document.getElementById('tabSent').className = type === 'sent' ? 'primary-btn' : 'outline-btn';

    const container = document.getElementById('requestsList');
    container.innerHTML = '<p class="section-text" style="color:var(--c-text-secondary);">Loading requests...</p>';

    try {
        const res = await authFetch(`/api/requests?type=${type}`);
        if (res && res.ok) {
            const requests = await res.json();
            renderRequests(requests, type);
        } else {
            container.innerHTML = '<p class="section-text" style="color:var(--c-error);">Failed to load requests.</p>';
        }
    } catch (err) {
        console.error('loadRequests error:', err);
        container.innerHTML = '<p class="section-text" style="color:var(--c-error);">Network error loading requests.</p>';
    }
}

function renderRequests(requests, type) {
    const container = document.getElementById('requestsList');

    if (!requests || !requests.length) {
        container.innerHTML = `
            <div class="dash-card" style="text-align:center;padding:50px 20px;">
                <i class="fa-solid fa-inbox" style="font-size:44px;color:var(--c-border);margin-bottom:14px;display:block;"></i>
                <h3 style="color:var(--c-dark);margin-bottom:6px;">No ${type} requests</h3>
                <p style="color:var(--c-text-secondary);">${type === 'received' ? 'You have no pending join requests for your projects.' : 'You haven\'t applied to join any projects yet.'}</p>
            </div>
        `;
        return;
    }

    container.innerHTML = requests.map(r => {
        const otherUser = type === 'received' ? r.requester : (r.project?.owner || {});
        const isPending = r.status === 'pending';

        return `
            <div class="request-card ${isPending ? 'pending' : ''}">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
                    <div>
                        <h3 style="margin-bottom:6px;font-size:18px;color:var(--c-dark);">
                            <a href="project-details.html?id=${r.project?._id || r.project}" style="color:inherit;text-decoration:underline;">
                                ${r.project?.title || 'Project'}
                            </a>
                        </h3>
                        <p style="margin:4px 0;font-size:13.5px;color:var(--c-text-secondary);">
                            <strong>${type === 'received' ? 'Applicant' : 'Project Owner'}:</strong>
                            ${otherUser?.name || 'Developer'} ${otherUser?.email ? `(${otherUser.email})` : ''}
                        </p>
                        ${type === 'received' && otherUser?.skills?.length ? `
                            <div class="tags" style="margin:6px 0;">
                                ${(otherUser.skills || []).map(s => `<span>${s}</span>`).join('')}
                            </div>
                        ` : ''}
                        <p style="margin:4px 0;font-size:13px;color:var(--c-text-secondary);">
                            <strong>Submitted:</strong> ${new Date(r.createdAt).toLocaleString()}
                        </p>
                        <div style="margin-top:8px;">
                            <span class="status ${r.status}">${r.status}</span>
                        </div>
                    </div>

                    <div class="request-actions">
                        ${type === 'received' && isPending ? `
                            <button class="accept-btn" onclick="handleRequest('${r._id}', 'accepted')"><i class="fa-solid fa-check"></i> Accept</button>
                            <button class="btn-delete" onclick="handleRequest('${r._id}', 'rejected')"><i class="fa-solid fa-xmark"></i> Decline</button>
                        ` : ''}
                        ${type === 'sent' && isPending ? `
                            <button class="btn-delete" onclick="cancelRequest('${r._id}')"><i class="fa-solid fa-xmark"></i> Cancel Request</button>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

async function handleRequest(id, action) {
    try {
        const res = await authFetch(`/api/requests/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: action })
        });

        if (res && res.ok) {
            showToast(`Request ${action} successfully!`, 'success');
            loadRequests(currentTab);
            updateSidebarBadges();
        } else {
            const err = res ? await res.json() : {};
            showToast(err.message || 'Action failed', 'error');
        }
    } catch (err) {
        showToast('Network error handling request', 'error');
    }
}

async function cancelRequest(id) {
    if (!confirm('Are you sure you want to cancel this join request?')) return;
    try {
        const res = await authFetch(`/api/requests/${id}`, { method: 'DELETE' });
        if (res && res.ok) {
            showToast('Request cancelled.', 'info');
            loadRequests(currentTab);
            updateSidebarBadges();
        } else {
            const err = res ? await res.json() : {};
            showToast(err.message || 'Failed to cancel request', 'error');
        }
    } catch (err) {
        showToast('Network error', 'error');
    }
}
</script>
</body>
</html>
