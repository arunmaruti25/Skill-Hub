<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <header class="mobile-top-bar" id="mobileTopBar" aria-label="Mobile Navigation Bar">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="dashboard.html" class="mobile-logo">
            <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
            <span class="mobile-logo-text">Skill Hub</span>
        </a>
        <a href="profile.html" class="mobile-avatar-link" aria-label="View My Profile">
            <div id="mobileUserAvatar" class="avatar mobile-avatar">U</div>
        </a>
    </header>


    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>


    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
                <span class="logo-text">Skill Hub</span>
            </a>
            <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
                <i class="fa-solid fa-angles-left"></i>
            </button>
            <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close navigation menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav>
            <a href="dashboard.html" title="Dashboard" data-tooltip="Dashboard"><i class="fa-solid fa-house"></i> <span class="nav-label">Dashboard</span></a>
            <a href="teammates.html" title="Find Teammates" data-tooltip="Find Teammates"><i class="fa-solid fa-user-group"></i> <span class="nav-label">Find Teammates</span></a>
            <a href="projects.html" title="Projects" data-tooltip="Projects"><i class="fa-solid fa-folder"></i> <span class="nav-label">Projects</span></a>
            <a href="requests.html" title="Requests" data-tooltip="Requests"><i class="fa-solid fa-paper-plane"></i> <span class="nav-label">Requests</span><span id="requestBadge" class="sidebar-badge">0</span></a>
            <a href="notifications.html" title="Notifications" data-tooltip="Notifications"><i class="fa-solid fa-bell"></i> <span class="nav-label">Notifications</span><span id="notificationBadge" class="sidebar-badge">0</span></a>
            <a href="messages.html" class="active" title="Messages" data-tooltip="Messages"><i class="fa-solid fa-message"></i> <span class="nav-label">Messages</span><span id="messageBadge" class="sidebar-badge">0</span></a>
            <a href="admin.html" id="adminNavLink" style="display:none;" title="Admin Panel" data-tooltip="Admin Panel"><i class="fa-solid fa-shield-halved"></i> <span class="nav-label">Admin Panel</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html" title="My Profile" data-tooltip="My Profile"><i class="fa-solid fa-user"></i> <span class="nav-label">My Profile</span></a>
            <a href="javascript:void(0)" onclick="logout()" title="Logout" data-tooltip="Logout"><i class="fa-solid fa-right-from-bracket"></i> <span class="nav-label">Logout</span></a>
        </div>
    </aside>

<main class="dashboard" style="padding-bottom:16px;">
    <div class="page-head" style="margin-bottom:16px;">
        <a href="messages.html" class="outline-btn" style="padding:6px 14px;font-size:12.5px;"><i class="fa-solid fa-arrow-left"></i> All Messages</a>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar" id="partnerAvatar" style="width:44px;height:44px;font-size:16px;">U</div>
            <div style="flex:1;">
                <h3 id="partnerName" style="margin:0;font-size:16px;color:var(--c-dark);">Loading...</h3>
                <p id="partnerProfession" style="margin:0;font-size:12px;color:var(--c-text-secondary);">Direct Message</p>
            </div>
            <a href="javascript:void(0)" id="partnerProfileLink" class="outline-btn" style="padding:6px 12px;font-size:12px;"><i class="fa-solid fa-user"></i> Profile</a>
        </div>

        <div class="chat-messages" id="chatMessages">
            <p class="section-text" style="margin:auto;text-align:center;color:var(--c-text-secondary);">Loading messages...</p>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
            <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>
</main>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
let partnerUserId = null;
let currentUserId = null;
let messagePollInterval = null;

document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;

    const user = getAuthUser();
    currentUserId = user.id || user._id;

    const urlParams = new URLSearchParams(window.location.search);
    partnerUserId = urlParams.get('user');

    if (!partnerUserId) {
        showToast('Please select a conversation first.', 'info');
        window.location.href = 'messages.html';
        return;
    }

    loadPartnerProfile();
    loadMessages();


    messagePollInterval = setInterval(loadMessages, 3500);

    const form = document.getElementById('chatForm');
    form.addEventListener('submit', sendMessage);
});

window.addEventListener('beforeunload', () => {
    if (messagePollInterval) clearInterval(messagePollInterval);
});

async function loadPartnerProfile() {
    try {
        const res = await authFetch(`/api/profile/${partnerUserId}`);
        if (res && res.ok) {
            const partner = await res.json();
            document.getElementById('partnerName').textContent = partner.name || 'User';
            document.getElementById('partnerProfession').textContent = partner.profession || 'Skill Hub Member';
            document.getElementById('partnerProfileLink').href = `user-profile.html?id=${partnerUserId}`;

            const avatar = document.getElementById('partnerAvatar');
            if (avatar) {
                avatar.innerHTML = partner.profileImage
                    ? `<img src="${partner.profileImage.startsWith('http') ? partner.profileImage : API_BASE_URL + partner.profileImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
                    : (partner.name || 'U').charAt(0).toUpperCase();
            }
        }
    } catch (err) {
        console.error('loadPartnerProfile error:', err);
    }
}

async function loadMessages() {
    try {
        const res = await authFetch(`/api/messages/${currentUserId}/${partnerUserId}`);
        if (res && res.ok) {
            const messages = await res.json();
            renderMessages(messages);
        }
    } catch (err) {
        console.error('loadMessages error:', err);
    }
}

function renderMessages(messages) {
    const container = document.getElementById('chatMessages');

    if (!messages.length) {
        container.innerHTML = `
            <div style="margin:auto;text-align:center;color:var(--c-text-secondary);padding:30px;">
                <i class="fa-solid fa-comments" style="font-size:36px;color:var(--c-border);margin-bottom:10px;display:block;"></i>
                <p style="font-size:14px;font-weight:600;">No messages yet.</p>
                <small>Send a greeting to start your conversation!</small>
            </div>
        `;
        return;
    }

    const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 100;

    container.innerHTML = messages.map(m => {
        const isSent = (m.sender?._id || m.sender) === currentUserId;
        const timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

        return `
            <div class="message-row ${isSent ? 'sent' : 'received'}">
                <div class="message-bubble">
                    <div>${escapeHtml(m.message)}</div>
                    <div class="message-time">${timeStr}</div>
                </div>
            </div>
        `;
    }).join('');

    if (wasAtBottom) {
        container.scrollTop = container.scrollHeight;
    }
}

async function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';

    try {
        const res = await authFetch('/api/messages', {
            method: 'POST',
            body: JSON.stringify({
                receiver: partnerUserId,
                message
            })
        });

        if (res && res.ok) {
            loadMessages();
            const container = document.getElementById('chatMessages');
            setTimeout(() => container.scrollTop = container.scrollHeight, 100);
        } else {
            showToast('Failed to send message.', 'error');
        }
    } catch (err) {
        showToast('Network error sending message', 'error');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
