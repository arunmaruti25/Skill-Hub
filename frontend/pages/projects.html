<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Projects - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <!-- Mobile Sticky Top Header (< 1024px) -->
    <header class="mobile-top-bar" id="mobileTopBar" aria-label="Mobile Navigation Bar">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="dashboard.html" class="mobile-logo">
            <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
            <span class="mobile-logo-text">Skill Hub</span>
        </a>
        <a href="profile.html" class="mobile-avatar-link" aria-label="View My Profile">
            <div id="mobileUserAvatar" class="avatar mobile-avatar">U</div>
        </a>
    </header>

    <!-- Mobile Drawer Overlay / Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Collapsible Sidebar / Off-Canvas Drawer -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
                <span class="logo-text">Skill Hub</span>
            </a>
            <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
                <i class="fa-solid fa-angles-left"></i>
            </button>
            <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close navigation menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav>
            <a href="dashboard.html" title="Dashboard" data-tooltip="Dashboard"><i class="fa-solid fa-house"></i> <span class="nav-label">Dashboard</span></a>
            <a href="teammates.html" title="Find Teammates" data-tooltip="Find Teammates"><i class="fa-solid fa-user-group"></i> <span class="nav-label">Find Teammates</span></a>
            <a href="projects.html" class="active" title="Projects" data-tooltip="Projects"><i class="fa-solid fa-folder"></i> <span class="nav-label">Projects</span></a>
            <a href="requests.html" title="Requests" data-tooltip="Requests"><i class="fa-solid fa-paper-plane"></i> <span class="nav-label">Requests</span><span id="requestBadge" class="sidebar-badge">0</span></a>
            <a href="notifications.html" title="Notifications" data-tooltip="Notifications"><i class="fa-solid fa-bell"></i> <span class="nav-label">Notifications</span><span id="notificationBadge" class="sidebar-badge">0</span></a>
            <a href="messages.html" title="Messages" data-tooltip="Messages"><i class="fa-solid fa-message"></i> <span class="nav-label">Messages</span><span id="messageBadge" class="sidebar-badge">0</span></a>
            <a href="admin.html" id="adminNavLink" style="display:none;" title="Admin Panel" data-tooltip="Admin Panel"><i class="fa-solid fa-shield-halved"></i> <span class="nav-label">Admin Panel</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html" title="My Profile" data-tooltip="My Profile"><i class="fa-solid fa-user"></i> <span class="nav-label">My Profile</span></a>
            <a href="javascript:void(0)" onclick="logout()" title="Logout" data-tooltip="Logout"><i class="fa-solid fa-right-from-bracket"></i> <span class="nav-label">Logout</span></a>
        </div>
    </aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Explore Projects</h1>
            <p>Discover projects, find open roles, and build together.</p>
        </div>
        <button class="primary-btn" onclick="showCreateProject()"><i class="fa-solid fa-plus"></i> Create Project</button>
    </div>

    <div class="dashboard-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="projectSearch" placeholder="Search projects by title, description or skill..." oninput="filterProjects()">
    </div>

    <div class="filters">
        <select id="skillFilter" onchange="filterProjects()">
            <option value="">All Skills</option>
        </select>
        <select id="sortFilter" onchange="filterProjects()">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="popular">Most Members</option>
        </select>
    </div>

    <div id="projectsGrid" class="people">
        <p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-text-secondary);">Loading projects...</p>
    </div>
</main>

<!-- Create Project Modal -->
<div id="createProjectModal" class="modal">
    <div class="auth-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h2 style="margin:0;font-size:22px;color:var(--c-dark);">Create New Project</h2>
            <button type="button" class="outline-btn" onclick="closeCreateProject()" style="padding:6px 12px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="createProjectForm">
            <label>Project Title</label>
            <input type="text" name="title" id="createTitle" placeholder="e.g. AI-Powered Code Reviewer" required>

            <label>Description</label>
            <textarea name="description" id="createDesc" placeholder="Describe your project goals, features, and stack..." required></textarea>

            <label>Required Skills (comma separated)</label>
            <input type="text" name="skills" id="createSkills" placeholder="React, Node.js, Python, MongoDB" required>

            <button type="submit" class="primary-btn" style="width:100%;height:46px;margin-top:14px;">
                <i class="fa-solid fa-plus"></i> Create Project
            </button>
        </form>
    </div>
</div>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
let allProjects = [];

document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;

    // Check URL parameters for preset search/skill filter
    const urlParams = new URLSearchParams(window.location.search);
    const searchParam = urlParams.get('search');
    const skillParam = urlParams.get('skill');

    if (searchParam) {
        document.getElementById('projectSearch').value = searchParam;
    }

    loadSkillFilter(skillParam);
    loadProjects();
});

function showCreateProject() {
    document.getElementById('createProjectModal').style.display = 'flex';
}

function closeCreateProject() {
    document.getElementById('createProjectModal').style.display = 'none';
}

async function loadSkillFilter(preselectedSkill) {
    try {
        const res = await authFetch('/api/skills');
        if (res && res.ok) {
            const skills = await res.json();
            const select = document.getElementById('skillFilter');
            skills.forEach(s => select.add(new Option(s, s, false, preselectedSkill && s.toLowerCase() === preselectedSkill.toLowerCase())));
            if (preselectedSkill) filterProjects();
        }
    } catch (err) {
        console.error('Load skills error:', err);
    }
}

async function loadProjects() {
    try {
        const res = await authFetch('/api/projects');
        if (res && res.ok) {
            allProjects = await res.json();
            filterProjects();
        } else {
            document.getElementById('projectsGrid').innerHTML = '<p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-error);">Failed to load projects.</p>';
        }
    } catch (err) {
        console.error('Load projects error:', err);
        document.getElementById('projectsGrid').innerHTML = '<p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-error);">Network error loading projects.</p>';
    }
}

function filterProjects() {
    const search = (document.getElementById('projectSearch')?.value || '').toLowerCase().trim();
    const skill = (document.getElementById('skillFilter')?.value || '').toLowerCase().trim();
    const sort = document.getElementById('sortFilter')?.value || 'newest';

    let filtered = allProjects.filter(p => {
        const titleMatch = (p.title || '').toLowerCase().includes(search);
        const descMatch = (p.description || '').toLowerCase().includes(search);
        const ownerMatch = (p.owner?.name || '').toLowerCase().includes(search);
        const skillTagMatch = (p.skills || []).some(s => s.toLowerCase().includes(search));
        const matchesSearch = !search || titleMatch || descMatch || ownerMatch || skillTagMatch;

        const matchesSkill = !skill || (p.skills || []).some(s => s.toLowerCase() === skill);

        return matchesSearch && matchesSkill;
    });

    if (sort === 'oldest') {
        filtered.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    } else if (sort === 'popular') {
        filtered.sort((a, b) => (b.members?.length || 0) - (a.members?.length || 0));
    } else {
        filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }

    renderProjects(filtered);
}

function renderProjects(projects) {
    const container = document.getElementById('projectsGrid');
    if (!projects.length) {
        container.innerHTML = '<p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-text-secondary);padding:40px 0;">No projects matching your search criteria.</p>';
        return;
    }

    container.innerHTML = projects.map(p => `
        <div class="person" style="text-align:left;padding:22px;">
            <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;">
                <div class="project-icon"><i class="fa-solid fa-code"></i></div>
                <div style="flex:1;min-width:0;">
                    <h3 style="color:var(--c-dark);margin-bottom:4px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.title}</h3>
                    <p style="color:var(--c-text-secondary);font-size:13px;line-height:1.4;">${p.description ? p.description.substring(0, 90) + '...' : 'No description.'}</p>
                </div>
            </div>

            <div class="tags" style="margin-bottom:14px;">
                ${(p.skills || []).map(s => `<span>${s}</span>`).join('')}
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--c-border);">
                <div style="display:flex;align-items:center;gap:6px;color:var(--c-text-secondary);font-size:12.5px;">
                    <i class="fa-solid fa-user"></i> <span>${p.owner?.name || 'Unknown'}</span>
                    <span style="opacity:0.5;">&bull;</span>
                    <i class="fa-solid fa-users"></i> <span>${p.members?.length || 1}</span>
                </div>
                <a href="project-details.html?id=${p._id}" class="primary-btn" style="padding:6px 14px;font-size:12.5px;">View Details</a>
            </div>
        </div>
    `).join('');
}

document.getElementById('createProjectForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('createTitle').value.trim();
    const description = document.getElementById('createDesc').value.trim();
    const skills = document.getElementById('createSkills').value;

    const btn = e.target.querySelector("button[type='submit']");
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';
    btn.disabled = true;

    try {
        const res = await authFetch('/api/projects', {
            method: 'POST',
            body: JSON.stringify({ title, description, skills })
        });

        if (res && res.ok) {
            showToast('Project created successfully!', 'success');
            closeCreateProject();
            document.getElementById('createProjectForm').reset();
            loadProjects();
            updateSidebarBadges();
        } else {
            const err = res ? await res.json() : {};
            showToast(err.message || 'Failed to create project', 'error');
        }
    } catch (err) {
        showToast('Network error. Please try again.', 'error');
    } finally {
        btn.innerHTML = orig;
        btn.disabled = false;
    }
});
</script>
</body>
</html>
