<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Notifications - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .notification-actions { display: flex; gap: 10px; margin-top: 12px; }
    </style>
</head>
<body>
    <!-- Mobile Sticky Top Header (< 1024px) -->
    <header class="mobile-top-bar" id="mobileTopBar" aria-label="Mobile Navigation Bar">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="dashboard.html" class="mobile-logo">
            <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
            <span class="mobile-logo-text">Skill Hub</span>
        </a>
        <a href="profile.html" class="mobile-avatar-link" aria-label="View My Profile">
            <div id="mobileUserAvatar" class="avatar mobile-avatar">U</div>
        </a>
    </header>

    <!-- Mobile Drawer Overlay / Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Collapsible Sidebar / Off-Canvas Drawer -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
                <span class="logo-text">Skill Hub</span>
            </a>
            <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
                <i class="fa-solid fa-angles-left"></i>
            </button>
            <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close navigation menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav>
            <a href="dashboard.html" title="Dashboard" data-tooltip="Dashboard"><i class="fa-solid fa-house"></i> <span class="nav-label">Dashboard</span></a>
            <a href="teammates.html" title="Find Teammates" data-tooltip="Find Teammates"><i class="fa-solid fa-user-group"></i> <span class="nav-label">Find Teammates</span></a>
            <a href="projects.html" title="Projects" data-tooltip="Projects"><i class="fa-solid fa-folder"></i> <span class="nav-label">Projects</span></a>
            <a href="requests.html" title="Requests" data-tooltip="Requests"><i class="fa-solid fa-paper-plane"></i> <span class="nav-label">Requests</span><span id="requestBadge" class="sidebar-badge">0</span></a>
            <a href="notifications.html" class="active" title="Notifications" data-tooltip="Notifications"><i class="fa-solid fa-bell"></i> <span class="nav-label">Notifications</span><span id="notificationBadge" class="sidebar-badge">0</span></a>
            <a href="messages.html" title="Messages" data-tooltip="Messages"><i class="fa-solid fa-message"></i> <span class="nav-label">Messages</span><span id="messageBadge" class="sidebar-badge">0</span></a>
            <a href="admin.html" id="adminNavLink" style="display:none;" title="Admin Panel" data-tooltip="Admin Panel"><i class="fa-solid fa-shield-halved"></i> <span class="nav-label">Admin Panel</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html" title="My Profile" data-tooltip="My Profile"><i class="fa-solid fa-user"></i> <span class="nav-label">My Profile</span></a>
            <a href="javascript:void(0)" onclick="logout()" title="Logout" data-tooltip="Logout"><i class="fa-solid fa-right-from-bracket"></i> <span class="nav-label">Logout</span></a>
        </div>
    </aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Notifications</h1>
            <p>Stay updated on invitations, join requests, and project activity.</p>
        </div>
        <button class="outline-btn" id="markAllBtn" onclick="markAllNotificationsRead()"><i class="fa-solid fa-check-double"></i> Mark All as Read</button>
    </div>

    <div id="notificationsList">
        <p class="section-text" style="color:var(--c-text-secondary);">Loading notifications...</p>
    </div>
</main>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;
    loadNotifications();
});

async function loadNotifications() {
    const container = document.getElementById('notificationsList');
    try {
        const res = await authFetch('/api/notifications');
        if (res && res.ok) {
            const notifs = await res.json();
            renderNotifications(notifs);
            updateSidebarBadges();
        } else {
            container.innerHTML = '<p class="section-text" style="color:var(--c-error);">Failed to load notifications.</p>';
        }
    } catch (err) {
        console.error('loadNotifications error:', err);
        container.innerHTML = '<p class="section-text" style="color:var(--c-error);">Network error loading notifications.</p>';
    }
}

function renderNotifications(notifs) {
    const container = document.getElementById('notificationsList');
    if (!notifs || !notifs.length) {
        container.innerHTML = `
            <div class="dash-card" style="text-align:center;padding:50px 20px;">
                <i class="fa-solid fa-bell-slash" style="font-size:44px;color:var(--c-border);margin-bottom:14px;display:block;"></i>
                <h3 style="color:var(--c-dark);margin-bottom:6px;">All Caught Up!</h3>
                <p style="color:var(--c-text-secondary);">You have no unread notifications at this time.</p>
            </div>
        `;
        return;
    }

    container.innerHTML = notifs.map(n => `
        <div class="notification-card ${n.read ? '' : 'unread'}" id="notif-${n._id}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
                <div style="flex:1;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-weight:700;color:var(--c-dark);font-size:15px;">${n.project?.title || 'System Notification'}</span>
                        ${!n.read ? '<span style="background:var(--c-primary);color:white;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;">NEW</span>' : ''}
                    </div>
                    <p style="margin:6px 0;font-size:14px;color:var(--c-text-dark);">${n.message}</p>
                    <small style="color:var(--c-text-secondary);font-size:12px;">${new Date(n.createdAt).toLocaleString()}</small>
                </div>

                <div style="display:flex;align-items:center;gap:8px;">
                    ${!n.read ? `
                        <button class="outline-btn" onclick="markNotificationRead('${n._id}')" style="padding:6px 12px;font-size:12px;">
                            <i class="fa-solid fa-check"></i> Read
                        </button>
                    ` : ''}
                </div>
            </div>

            ${n.type === 'project_invite' && n.request && n.request.status === 'pending' ? `
                <div class="notification-actions">
                    <button class="accept-btn" onclick="handleProjectInvite('${n.request._id}', 'accepted')"><i class="fa-solid fa-check"></i> Accept Invitation</button>
                    <button class="btn-delete" onclick="handleProjectInvite('${n.request._id}', 'rejected')"><i class="fa-solid fa-xmark"></i> Decline</button>
                </div>
            ` : ''}
            ${n.type === 'new_message' ? `
                <div class="notification-actions">
                    <a href="chat.html?user=${n.sender}" class="primary-btn" onclick="markNotificationRead('${n._id}')" style="padding:6px 12px;font-size:12px;text-decoration:none;"><i class="fa-solid fa-reply"></i> Reply</a>
                </div>
            ` : ''}
        </div>
    `).join('');
}

async function markNotificationRead(id) {
    try {
        const res = await authFetch(`/api/notifications/${id}/read`, { method: 'PUT' });
        if (res && res.ok) {
            const card = document.getElementById(`notif-${id}`);
            if (card) card.classList.remove('unread');
            loadNotifications();
        }
    } catch (err) {
        console.error('markNotificationRead error:', err);
    }
}

async function markAllNotificationsRead() {
    try {
        const res = await authFetch('/api/notifications/read-all', { method: 'PUT' });
        if (res && res.ok) {
            showToast('All notifications marked as read.', 'success');
            loadNotifications();
        }
    } catch (err) {
        showToast('Failed to mark notifications read.', 'error');
    }
}

async function handleProjectInvite(requestId, action) {
    if (!requestId || requestId === 'undefined') {
        return showToast('Invalid request associated with this invite.', 'error');
    }
    try {
        const res = await authFetch(`/api/requests/${requestId}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: action })
        });
        if (res && res.ok) {
            showToast(`Invitation ${action === 'accepted' ? 'accepted' : 'declined'}.`, 'success');
            loadNotifications();
            updateSidebarBadges();
        } else {
            const err = res ? await res.json() : {};
            showToast(err.message || 'Action failed', 'error');
        }
    } catch (err) {
        showToast('Network error responding to invite', 'error');
    }
}
</script>
</body>
</html>
