    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/style.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <header class="mobile-top-bar" id="mobileTopBar" aria-label="Mobile Navigation Bar">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="dashboard.html" class="mobile-logo">
            <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
            <span class="mobile-logo-text">Skill Hub</span>
        </a>
        <a href="profile.html" class="mobile-avatar-link" aria-label="View My Profile">
            <div id="mobileUserAvatar" class="avatar mobile-avatar">U</div>
        </a>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img" width="34" height="34">
                <span class="logo-text">Skill Hub</span>
            </a>
            <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true">
                <i class="fa-solid fa-angles-left"></i>
            </button>
            <button type="button" class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close navigation menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav>
            <a href="dashboard.html" title="Dashboard" data-tooltip="Dashboard"><i class="fa-solid fa-house"></i> <span class="nav-label">Dashboard</span></a>
            <a href="teammates.html" class="active" title="Find Teammates" data-tooltip="Find Teammates"><i class="fa-solid fa-user-group"></i> <span class="nav-label">Find Teammates</span></a>
            <a href="projects.html" title="Projects" data-tooltip="Projects"><i class="fa-solid fa-folder"></i> <span class="nav-label">Projects</span></a>
            <a href="requests.html" title="Requests" data-tooltip="Requests"><i class="fa-solid fa-paper-plane"></i> <span class="nav-label">Requests</span><span id="requestBadge" class="sidebar-badge">0</span></a>
            <a href="notifications.html" title="Notifications" data-tooltip="Notifications"><i class="fa-solid fa-bell"></i> <span class="nav-label">Notifications</span><span id="notificationBadge" class="sidebar-badge">0</span></a>
            <a href="messages.html" title="Messages" data-tooltip="Messages"><i class="fa-solid fa-message"></i> <span class="nav-label">Messages</span><span id="messageBadge" class="sidebar-badge">0</span></a>
            <a href="admin.html" id="adminNavLink" style="display:none;" title="Admin Panel" data-tooltip="Admin Panel"><i class="fa-solid fa-shield-halved"></i> <span class="nav-label">Admin Panel</span></a>
        </nav>
        <div class="sidebar-bottom">
            <a href="profile.html" title="My Profile" data-tooltip="My Profile"><i class="fa-solid fa-user"></i> <span class="nav-label">My Profile</span></a>
            <a href="javascript:void(0)" onclick="logout()" title="Logout" data-tooltip="Logout"><i class="fa-solid fa-right-from-bracket"></i> <span class="nav-label">Logout</span></a>
        </div>
    </aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Find Teammates</h1>
            <p>Connect with talented developers, designers, and creators.</p>
        </div>
    </div>

    <div class="dashboard-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="teammateSearch" placeholder="Search by name, skill, profession, or bio..." oninput="filterTeammates()">
    </div>

    <div class="filters">
        <select id="skillFilterTeammates" onchange="filterTeammates()">
            <option value="">All Skills</option>
        </select>
        <select id="availabilityFilter" onchange="filterTeammates()">
            <option value="">All Availabilities</option>
            <option value="Available">Available</option>
            <option value="Busy">Busy</option>
        </select>
    </div>

    <div id="teammatesGrid" class="people">
        <p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-text-secondary);">Loading teammates...</p>
    </div>
</main>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script>
let allTeammates = [];

document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;

    const urlParams = new URLSearchParams(window.location.search);
    const searchParam = urlParams.get('search');
    const skillParam = urlParams.get('skill');

    if (searchParam) {
        document.getElementById('teammateSearch').value = searchParam;
    }

    loadSkillFilter(skillParam);
    loadTeammates();
});

async function loadSkillFilter(preselectedSkill) {
    try {
        const res = await authFetch('/api/skills');
        if (res && res.ok) {
            const skills = await res.json();
            const select = document.getElementById('skillFilterTeammates');
            skills.forEach(s => select.add(new Option(s, s, false, preselectedSkill && s.toLowerCase() === preselectedSkill.toLowerCase())));
            if (preselectedSkill) filterTeammates();
        }
    } catch (err) {
        console.error('Load skills error:', err);
    }
}

async function loadTeammates() {
    try {
        const res = await authFetch('/api/users');
        if (res && res.ok) {
            allTeammates = await res.json();
            filterTeammates();
        } else {
            document.getElementById('teammatesGrid').innerHTML = '<p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-error);">Failed to load teammates.</p>';
        }
    } catch (err) {
        console.error('Load teammates error:', err);
        document.getElementById('teammatesGrid').innerHTML = '<p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-error);">Network error loading teammates.</p>';
    }
}

function filterTeammates() {
    const search = (document.getElementById('teammateSearch')?.value || '').toLowerCase().trim();
    const skill = (document.getElementById('skillFilterTeammates')?.value || '').toLowerCase().trim();
    const availability = (document.getElementById('availabilityFilter')?.value || '').toLowerCase().trim();

    const currentUser = getAuthUser();
    const currentUserId = currentUser.id || currentUser._id;

    const filtered = allTeammates.filter(t => {
        const nameMatch = (t.name || '').toLowerCase().includes(search);
        const profMatch = (t.profession || '').toLowerCase().includes(search);
        const bioMatch = (t.bio || '').toLowerCase().includes(search);
        const skillTagMatch = (t.skills || []).some(s => s.toLowerCase().includes(search));
        const matchesSearch = !search || nameMatch || profMatch || bioMatch || skillTagMatch;

        const matchesSkill = !skill || (t.skills || []).some(s => s.toLowerCase() === skill);
        const matchesAvail = !availability || (t.availability || '').toLowerCase() === availability;

        return matchesSearch && matchesSkill && matchesAvail;
    });

    renderTeammates(filtered, currentUserId);
}

function renderTeammates(teammates, currentUserId) {
    const container = document.getElementById('teammatesGrid');
    if (!teammates.length) {
        container.innerHTML = '<p class="section-text" style="grid-column:1/-1;text-align:center;color:var(--c-text-secondary);padding:40px 0;">No teammates matching your criteria.</p>';
        return;
    }

    container.innerHTML = teammates.map(t => {
        const isSelf = (t._id || t.id) === currentUserId;
        const avatarHtml = t.profileImage
            ? `<img src="${t.profileImage.startsWith('http') ? t.profileImage : API_BASE_URL + t.profileImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
            : (t.name || 'U').charAt(0).toUpperCase();

        return `
            <div class="person">
                <div class="avatar">${avatarHtml}</div>
                <h3>${t.name} ${isSelf ? '<span style="font-size:11px;color:var(--c-primary);font-weight:700;">(You)</span>' : ''}</h3>
                <p style="font-weight:600;color:var(--c-dark);">${t.profession || 'Developer'}</p>
                <p style="font-size:12.5px;color:var(--c-text-secondary);min-height:36px;margin:6px 0;">${t.bio ? t.bio.substring(0, 70) + '...' : 'Building great things on Skill Hub.'}</p>

                <div class="tags" style="justify-content:center;margin:8px 0 16px;">
                    ${(t.skills || []).slice(0, 4).map(s => `<span>${s}</span>`).join('')}
                </div>

                <div style="display:flex;gap:8px;margin-top:auto;">
                    <button class="outline-btn" onclick="location.href='user-profile.html?id=${t._id || t.id}'" style="flex:1;padding:8px;font-size:12.5px;">
                        <i class="fa-solid fa-user"></i> Profile
                    </button>
                    ${!isSelf ? `
                        <button class="primary-btn" onclick="location.href='chat.html?user=${t._id || t.id}'" style="padding:8px 14px;font-size:12.5px;">
                            <i class="fa-solid fa-message"></i> Chat
                        </button>
                    ` : ''}
                </div>
            </div>
        `;
    }).join('');
}
</script>
</body>
</html>
