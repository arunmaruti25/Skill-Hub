<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
:root {
        --c-white:       #FFFFFF;
        --c-bg-light:    #EAF6FF;
        --c-border:      #C1E5FF;
        --c-sky-mid:     #9CD5FF;
        --c-blue-primary:#6AB0E3;
        --c-text-dark:   #001D39;
        --c-error: #ef4444;
        --c-success: #22c55e;
        --c-warning: #f59e0b;
    }
    .sidebar-badge-link { display: flex !important; align-items: center; }
    .sidebar-badge { margin-left: auto; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 50%; background: var(--c-error); color: white; font-size: 12px; font-weight: bold; display: none; align-items: center; justify-content: center; }
    .request-card { border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: 20px; margin-top: 15px; background: var(--card-bg); }
    .request-card h3 { margin-bottom: 8px; color: #001D39; }
    .request-card p { margin: 7px 0; color: #2F4156; }
    .request-actions { display: flex; gap: 10px; margin-top: 15px; }
    .status { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .status.pending { background: rgba(245,158,11,0.2); color: var(--c-warning); }
    .status.accepted { background: rgba(34,197,94,0.2); color: var(--c-success); }
    .status.rejected { background: rgba(239,68,68,0.2); color: var(--c-error); }
    .empty-request { text-align: center; padding: 35px; color: #2F4156; }
</style>
</head>
<body>
<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="active sidebar-badge-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html" class="sidebar-badge-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="sidebar-badge-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Requests</h1>
            <p>Manage your project join requests</p>
        </div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
        <button class="primary-btn" onclick="loadRequests('received')" id="tabReceived"><i class="fa-solid fa-inbox"></i> Received</button>
        <button class="outline-btn" onclick="loadRequests('sent')" id="tabSent"><i class="fa-solid fa-paper-plane"></i> Sent</button>
    </div>

    <div id="requestsList">
        <div class="empty-request">
            <i class="fa-solid fa-inbox" style="font-size:48px;color:var(--c-border);margin-bottom:15px;"></i>
            <h3>No requests</h3>
            <p>Requests will appear here when teammates want to join your projects.</p>
        </div>
    </div>
</main>

<script src="../js/auth.js"></script>
<script>
const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:5000"
    : "https://skill-hub-backend-4w35.onrender.com";

document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    if (!token) return window.location.href = 'login.html';
    loadRequests('received');
});

function logout() { localStorage.clear(); window.location.href = '../index.html'; }
let currentTab = 'received';

async function loadRequests(type) {
    currentTab = type;
    const token = localStorage.getItem('token');
    
    document.getElementById('tabReceived').className = type === 'received' ? 'primary-btn' : 'outline-btn';
    document.getElementById('tabSent').className = type === 'sent' ? 'primary-btn' : 'outline-btn';
    
    try {
        const res = await fetch(`${API_BASE_URL}/api/requests?type=${type}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const requests = await res.json();
        renderRequests(requests, type);
    } catch (err) {
        console.error('Load requests error:', err);
    }
}

function renderRequests(requests, type) {
    const container = document.getElementById('requestsList');
    
    if (!requests.length) {
        container.innerHTML = `
            <div class="empty-request">
                <i class="fa-solid fa-inbox" style="font-size:48px;color:var(--c-border);margin-bottom:15px;"></i>
                <h3>No ${type} requests</h3>
                <p>${type === 'received' ? 'No one has requested to join your projects yet.' : 'You haven\'t sent any join requests yet.'}</p>
            </div>
        `;
        return;
    }

    container.innerHTML = requests.map(r => `
        <div class="request-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                    <h3>${r.project?.title || 'Unknown Project'}</h3>
                    <p><strong>${type === 'received' ? 'From' : 'To'}:</strong> ${r.requester?.name || r.recipient?.name || 'Unknown'}</p>
                    <p><strong>Status:</strong> <span class="status ${r.status}">${r.status}</span></p>
                    <p><strong>Date:</strong> ${new Date(r.createdAt).toLocaleDateString()}</p>
                </div>
                ${type === 'received' && r.status === 'pending' ? `
                    <div class="request-actions">
                        <button class="accept-btn" onclick="handleRequest('${r._id}', 'accepted')"><i class="fa-solid fa-check"></i> Accept</button>
                        <button class="reject-btn" onclick="handleRequest('${r._id}', 'rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
                    </div>
                ` : type === 'sent' && r.status === 'pending' ? `
                    <div class="request-actions">
                        <button class="outline-btn" onclick="cancelRequest('${r._id}')" style="color:var(--c-error);border-color:var(--c-error);"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                ` : ''}
            </div>
        </div>
    `).join('');
}

async function handleRequest(id, action) {
    const token = localStorage.getItem('token');
    try {
        await fetch(`${API_BASE_URL}/api/requests/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ status: action })
        });
        loadRequests(currentTab);
    } catch (err) {
        console.error('Handle request error:', err);
    }
}

async function cancelRequest(id) {
    if (!confirm('Cancel this request?')) return;
    const token = localStorage.getItem('token');
    try {
        await fetch(`${API_BASE_URL}/api/requests/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        loadRequests(currentTab);
    } catch (err) { alert('Failed to cancel request'); }
}
</script>
</body>
</html>
