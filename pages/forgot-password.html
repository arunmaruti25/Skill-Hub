<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root { --bg-dark: #001D39; --card-bg: #0A4174; --accent-blue: #7BBDE8; --soft-blue: #6EA2B3; --light-blue: #BDD8E9; --white: #fff; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', Arial, sans-serif; background: radial-gradient(circle at top, #0A4174, #001D39 75%); color: var(--white); min-height: 100vh; }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 20px; position: relative; overflow: hidden; }
        .auth-page::before, .auth-page::after { content: ""; position: absolute; border-radius: 50%; filter: blur(80px); }
        .auth-page::before { width: 400px; height: 400px; background: rgba(123,189,232,.18); top: -150px; left: -100px; }
        .auth-page::after { width: 350px; height: 350px; background: rgba(189,216,233,.12); bottom: -150px; right: -100px; }
        .auth-box { width: 100%; max-width: 460px; padding: 38px; background: rgba(10,65,116,.92); border: 1px solid rgba(73,118,159,.45); border-radius: 24px; position: relative; z-index: 2; box-shadow: 0 25px 60px rgba(0,0,0,.45); backdrop-filter: blur(15px); }
        .auth-box .logo { display: flex; align-items: center; gap: 10px; color: var(--white); font-size: 24px; font-weight: 800; text-decoration: none; margin-bottom: 25px; }
        .auth-box .logo i { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--accent-blue); color: var(--bg-dark); border-radius: 12px; font-size: 19px; }
        .auth-box h1 { margin: 0 0 8px; color: var(--light-blue); font-size: 28px; font-weight: 800; }
        .auth-box > p { margin: 0 0 24px; color: var(--soft-blue); font-size: 13.5px; }
        #resetForm { display: flex; flex-direction: column; }
        #resetForm label { margin-bottom: 7px; color: var(--light-blue); font-size: 13px; font-weight: 600; }
        #resetForm input { width: 100%; height: 48px; padding: 0 14px; margin-bottom: 18px; background: rgba(0,29,57,.65); border: 1px solid rgba(73,118,159,.45); border-radius: 11px; outline: none; color: var(--white); font-size: 14px; transition: .25s; }
        #resetForm input::placeholder { color: var(--soft-blue); }
        #resetForm input:focus { border-color: var(--accent-blue); background: rgba(0,29,57,.9); box-shadow: 0 0 0 3px rgba(123,189,232,.18); }
        #resetForm .primary-btn { width: 100%; height: 48px; margin-top: 5px; border: none; border-radius: 11px; background: linear-gradient(135deg, var(--accent-blue) 0%, #4E8EA2 100%); color: var(--bg-dark); font-size: 14px; font-weight: 800; cursor: pointer; transition: .25s; }
        #resetForm .primary-btn:hover { background: linear-gradient(135deg, #ffffff 0%, var(--accent-blue) 100%); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(123,189,232,.35); }
        .auth-link { text-align: center; margin: 20px 0 0 !important; color: var(--soft-blue) !important; font-size: 13px !important; }
        .auth-link a { color: var(--accent-blue); font-weight: 700; text-decoration: none; }
        .auth-link a:hover { color: var(--white); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-box">
            <a href="../index.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
            <h1>Reset Password</h1>
            <p>Enter your registered email and choose a new password.</p>
            <form id="resetForm">
                <label>Email Address</label>
                <input type="email" id="resetEmail" placeholder="Enter your registered email" required>
                <label>New Password (min 6 characters)</label>
                <input type="password" id="resetNewPassword" placeholder="Enter new password" minlength="6" required>
                <label>Confirm New Password</label>
                <input type="password" id="resetConfirmPassword" placeholder="Re-enter new password" minlength="6" required>
                <button type="submit" class="primary-btn">Reset Password</button>
            </form>
            <p class="auth-link">Remembered your password? <a href="login.html">Back to Login</a></p>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
    const resetForm = document.getElementById("resetForm");
    if (resetForm) {
        resetForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("resetEmail").value.trim();
            const password = document.getElementById("resetNewPassword").value;
            const confirmPassword = document.getElementById("resetConfirmPassword").value;

            if (password.length < 6) return alert("Password must be at least 6 characters long.");
            if (password !== confirmPassword) return alert("Passwords do not match.");

            try {
                const res = await fetch(`${API_BASE_URL}/api/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("🎉 " + data.message);
                    window.location.href = "login.html";
                } else {
                    alert(data.message || "Password reset failed.");
                }
            } catch (err) {
                alert("Cannot connect to the server. Make sure backend is running.");
            }
        });
    }
    </script>
</body>
</html>
