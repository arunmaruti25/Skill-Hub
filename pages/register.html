<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
:root {
        --c-white:       #FFFFFF;
        --c-bg-light:    #EAF6FF;
        --c-border:      #C1E5FF;
        --c-sky-mid:     #9CD5FF;
        --c-blue-primary:#6AB0E3;
        --c-text-dark:   #001D39;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', Arial, sans-serif; background: var(--c-bg-light); color: var(--c-text-dark); min-height: 100vh; }
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 20px; position: relative; overflow: hidden; }
    .auth-page::before, .auth-page::after { content: ""; position: absolute; border-radius: 50%; filter: blur(80px); }
    .auth-page::before { width: 400px; height: 400px; background: rgba(156,213,255,.18); top: -150px; left: -100px; }
    .auth-page::after { width: 350px; height: 350px; background: rgba(193,229,255,.12); bottom: -150px; right: -100px; }
    .auth-box { width: 100%; max-width: 460px; padding: 38px; background: rgba(255,255,255,0.9); border: 1px solid var(--c-border); border-radius: 24px; position: relative; z-index: 2; box-shadow: 0 25px 60px rgba(0,29,57,0.15), 0 0 30px rgba(156,213,255,0.12); backdrop-filter: blur(15px); }
    .auth-box .logo { display: flex; align-items: center; gap: 10px; color: var(--c-blue-primary); font-size: 24px; font-weight: 800; text-decoration: none; margin-bottom: 25px; }
    .auth-box .logo i { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--c-sky-mid); color: var(--c-text-dark); border-radius: 12px; font-size: 19px; }
    .auth-box h1 { margin: 0 0 8px; color: var(--c-blue-primary); font-size: 30px; }
    .auth-box > p { margin: 0 0 28px; color: var(--c-border); font-size: 14px; }
    #registerForm { display: flex; flex-direction: column; }
    #registerForm label { margin-bottom: 7px; color: var(--c-blue-primary); font-size: 13px; font-weight: 600; }
    #registerForm input { width: 100%; height: 48px; padding: 0 14px; margin-bottom: 18px; background: rgba(255,255,255,0.7); border: 1.5px solid var(--border); border-radius: 11px; outline: none; color: var(--c-text-dark); font-size: 14px; transition: .25s; }
    #registerForm input::placeholder { color: rgba(193,229,255,.48); }
    #registerForm input:focus { border-color: var(--c-sky-mid); background: rgba(255,255,255,0.9); box-shadow: 0 0 0 3px rgba(156,213,255,.08); }
    .password-box { position: relative; }
    .password-box input { padding-right: 50px !important; }
    .password-box button { position: absolute; right: 10px; top: 0; width: 40px; height: 48px; border: none; background: transparent; color: var(--c-border); cursor: pointer; font-size: 15px; }
    .password-box button:hover { color: var(--c-sky-mid); }
    #registerForm .primary-btn { width: 100%; height: 48px; margin-top: 5px; border: none; border-radius: 11px; background: var(--c-blue-primary); color: var(--c-white); font-size: 14px; font-weight: 700; cursor: pointer; transition: .25s; }
    #registerForm .primary-btn:hover { background: var(--c-sky-mid); color: var(--c-text-dark); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(156,213,255,.25); }
    .auth-link { text-align: center; margin: 20px 0 0 !important; color: var(--c-border) !important; font-size: 13px !important; }
    .auth-link a { color: var(--c-sky-mid); font-weight: 700; text-decoration: none; }
    .auth-link a:hover { color: var(--c-white); text-decoration: underline; }
</style>
</head>
<body>
<div class="auth-page">
    <div class="auth-box">
        <a href="../index.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
        <h1>Create Account</h1>
        <p>Join Skill Hub and start collaborating</p>
        <form id="registerForm">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" name="name" placeholder="John Doe" required autocomplete="name">
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" name="email" placeholder="you@example.com" required autocomplete="email">
            <label for="regPassword">Password</label>
            <div class="password-box">
                <input type="password" id="regPassword" name="password" placeholder="Create a password" required autocomplete="new-password" minlength="8">
                <button type="button" class="toggle-password" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
            </div>
            <label for="regConfirm">Confirm Password</label>
            <div class="password-box">
                <input type="password" id="regConfirm" name="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                <button type="button" class="toggle-password" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
            </div>
            <button type="submit" class="primary-btn"><i class="fa-solid fa-user-plus"></i> Create Account</button>
        </form>
        <p class="auth-link">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('registerForm');
    const toggleBtns = document.querySelectorAll('.toggle-password');

    toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const input = btn.previousElementSibling;
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            btn.innerHTML = type === 'password' ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
        });
    });

    form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        if (password !== confirm) {
            alert('Passwords do not match');
            return;
        }
        if (password.length < 8) {
            alert('Password must be at least 8 characters');
            return;
        }

        const btn = form.querySelector('.primary-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';
        btn.disabled = true;

        const formData = new FormData(form);
        const data = Object.fromEntries(formData);
        delete data.confirmPassword;

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                localStorage.setItem('token', result.token);
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = 'dashboard.html';
            } else {
                alert(result.message || 'Registration failed');
            }
        } catch (err) {
            alert('Network error. Please try again.');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });
});
</script>
</body>
</html>
