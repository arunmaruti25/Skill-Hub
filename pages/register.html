<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-box">
        <a href="../index.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
        <h1>Create Account</h1>
        <p>Join Skill Hub and start collaborating today</p>
        
        <div id="verifyNotice" style="display:none;background:#EAF2F7;border:1px solid #C8D9E6;border-radius:12px;padding:18px 20px;margin-bottom:18px;text-align:center;">
            <i class="fa-solid fa-envelope-circle-check" style="font-size:28px;color:#567C8D;margin-bottom:8px;display:block;"></i>
            <strong style="color:#2F4156;font-size:15px;">Check your inbox</strong>
            <p style="color:#567C8D;font-size:13px;margin:6px 0 12px;">We sent a verification link to <strong id="sentEmail"></strong>. Click the link to activate your account.</p>
            <button onclick="resendVerification()" class="outline-btn" style="font-size:12.5px;padding:8px 16px;">
                <i class="fa-solid fa-rotate-right"></i> Resend Email
            </button>
        </div>

        <form id="registerForm">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" name="name" placeholder="John Doe" required autocomplete="name">
            
            <label for="regEmail">Email Address</label>
            <input type="email" id="regEmail" name="email" placeholder="you@example.com" required autocomplete="email">
            
            <label for="regPassword">Password (min 6 characters)</label>
            <div class="password-wrapper">
                <input type="password" id="regPassword" name="password" placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
                <button type="button" class="toggle-password-btn" onclick="togglePassword('regPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            
            <label for="regConfirm">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="regConfirm" name="confirmPassword" placeholder="Repeat your password" required autocomplete="new-password">
                <button type="button" class="toggle-password-btn" onclick="togglePassword('regConfirm', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            
            <button type="submit" class="primary-btn" style="width:100%;height:46px;margin-top:4px;">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <p class="auth-link">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
</div>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
let registeredEmail = "";

document.addEventListener("DOMContentLoaded", () => {
    if (getAuthToken() && getAuthUser()?.name) {
        window.location.href = "dashboard.html";
        return;
    }

    const form = document.getElementById("registerForm");
    form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim().toLowerCase();
        const password = document.getElementById("regPassword").value;
        const confirmPassword = document.getElementById("regConfirm").value;

        if (password.length < 6) return showToast("Password must be at least 6 characters long.", "warning");
        if (password !== confirmPassword) return showToast("Passwords do not match.", "warning");

        const btn = form.querySelector("button[type='submit']");
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/api/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, password })
            });
            const result = await res.json();

            if (res.status === 201) {
                // Account created — show verify notice, hide form
                registeredEmail = email;
                document.getElementById("sentEmail").textContent = email;
                form.style.display = "none";
                document.getElementById("verifyNotice").style.display = "block";
                document.querySelector(".auth-link").style.display = "none";
            } else if (result.needsVerification) {
                // Already registered but not verified
                registeredEmail = email;
                document.getElementById("sentEmail").textContent = email;
                form.style.display = "none";
                document.getElementById("verifyNotice").style.display = "block";
                document.querySelector(".auth-link").style.display = "none";
                showToast("Email already registered but not verified. Please check your inbox.", "warning");
            } else {
                showToast(result.message || "Registration failed. Please try again.", "error");
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        } catch (err) {
            showToast("Network error. Please try again.", "error");
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    });
});

async function resendVerification() {
    const email = registeredEmail || document.getElementById("sentEmail").textContent;
    if (!email) return showToast("Could not determine email. Please go back and register again.", "error");

    try {
        const res = await fetch(`${API_BASE_URL}/api/auth/resend-verification`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        const result = await res.json();
        showToast(result.message, res.ok ? "success" : "error");
    } catch {
        showToast("Network error. Please try again.", "error");
    }
}
</script>
</body>
</html>
