<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html" class="active"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="message-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html" class="message-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="message-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1 id="projectTitle">Loading project...</h1>
            <p>Project Details</p>
        </div>
        <a href="projects.html" class="outline-btn"><i class="fa-solid fa-arrow-left"></i> Back to Projects</a>
    </div>

    <section class="dash-card">
        <div class="project-icon"><i class="fa-solid fa-code"></i></div>
        <h2 id="projectName">Loading...</h2>
        <p id="projectDescription">Loading project description...</p>
        <br>
        <h3>Required Skills</h3>
        <div class="tags" id="projectSkills"><span>Loading...</span></div>
        <br>
        <h3>Project Owner</h3>
        <p id="projectOwner">Loading...</p>
        <br>
        <button class="primary-btn" id="joinButton" onclick="requestToJoin()">
            <i class="fa-solid fa-user-plus"></i> Request to Join
        </button>
    </section>
</main>

<script src="../js/app.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");

async function loadProject() {
    if (!projectId) {
        document.getElementById("projectTitle").textContent = "Project not found";
        return;
    }

    try {
        const res = await fetch(`${API_BASE_URL}/api/projects/` + projectId);
        const project = await res.json();
        if (!res.ok) return alert(project.message || "Project not found");

        document.getElementById("projectTitle").textContent = project.title;
        document.getElementById("projectName").textContent = project.title;
        document.getElementById("projectDescription").textContent = project.description;
        document.getElementById("projectOwner").textContent = project.owner?.name || "Unknown";

        const skillsContainer = document.getElementById("projectSkills");
        skillsContainer.innerHTML = "";
        const skills = project.skills || [];
        if (!skills.length) {
            skillsContainer.innerHTML = "<span>No specific skills listed</span>";
        } else {
            skills.forEach(skill => {
                const tag = document.createElement("span");
                tag.textContent = skill;
                skillsContainer.appendChild(tag);
            });
        }
    } catch {
        alert("Cannot connect to the server.");
    }
}

async function requestToJoin() {
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user?.id) return alert("Please login first.");

    const button = document.getElementById("joinButton");
    button.disabled = true;
    button.innerHTML = "Sending...";

    try {
        const res = await fetch(`${API_BASE_URL}/api/projects/${projectId}/request`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ requester: user.id })
        });
        const data = await res.json();
        if (res.ok) {
            alert("Join request sent successfully!");
            button.innerHTML = '<i class="fa-solid fa-check"></i> Request Sent';
        } else {
            alert(data.message || "Could not send request");
            button.disabled = false;
            button.innerHTML = '<i class="fa-solid fa-user-plus"></i> Request to Join';
        }
    } catch {
        alert("Cannot connect to the server.");
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-user-plus"></i> Request to Join';
    }
}

loadProject();
</script>
</body>
</html>
