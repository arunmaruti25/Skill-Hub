<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
:root {
        --c-white:       #FFFFFF;
        --c-bg-light:    #EAF6FF;
        --c-border:      #C1E5FF;
        --c-sky-mid:     #9CD5FF;
        --c-blue-primary:#6AB0E3;
        --c-text-dark:   #001D39;
    }
    .chat-container { height: calc(100vh - 180px); min-height: 500px; display: flex; flex-direction: column; }
    .chat-header { display: flex; align-items: center; gap: 15px; padding-bottom: 20px; border-bottom: 1px solid var(--c-border); }
    .chat-header .avatar { flex-shrink: 0; }
    .chat-header-info h2 { margin: 0; color: #001D39; }
    .chat-header-info p { margin: 5px 0 0; color: #2F4156; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 25px 10px; display: flex; flex-direction: column; gap: 12px; }
    .message-row { display: flex; width: 100%; }
    .message-row.sent { justify-content: flex-end; }
    .message-row.received { justify-content: flex-start; }
    .message-bubble { max-width: 65%; padding: 12px 16px; border-radius: 15px; word-wrap: break-word; }
    .message-row.sent .message-bubble { background: var(--c-blue-primary); color: var(--c-white); border-bottom-right-radius: 4px; }
    .message-row.received .message-bubble { background: var(--c-white); color: var(--c-text-dark); border: 1px solid var(--c-border); border-radius: 15px; }
    .message-time { font-size: 11px; margin-top: 5px; opacity: .7; }
    .chat-input-area { display: flex; gap: 10px; padding-top: 15px; border-top: 1px solid var(--c-border); }
    .chat-input-area input { flex: 1; padding: 13px 15px; border: 1px solid var(--c-border); border-radius: 25px; outline: none; font-size: 15px; color: var(--c-text-dark); }
    .chat-input-area button { border: none; border-radius: 25px; padding: 0 22px; background: var(--c-blue-primary); color: var(--c-white); cursor: pointer; }
    .chat-input-area button:hover { opacity: .9; }
    .no-messages { margin: auto; text-align: center; color: #2F4156; }
    .sidebar-message-link { display: flex !important; align-items: center; }
    .sidebar-message-badge { margin-left: auto; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 50%; background: #f44336; color: white; font-size: 12px; font-weight: bold; display: none; align-items: center; justify-content: center; }
    @media (max-width: 700px) {
        .message-bubble { max-width: 85%; }
        .chat-container { height: calc(100vh - 140px); }
    }
</style>
</head>
<body>
<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="sidebar-message-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-message-badge">0</span></a>
        <a href="notifications.html" class="sidebar-message-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-message-badge">0</span></a>
        <a href="messages.html" class="active sidebar-message-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-message-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Messages</h1>
            <p>Your conversations with teammates</p>
        </div>
    </div>

    <div class="chat-container" id="conversationsList">
        <div class="empty-messages">
            <i class="fa-solid fa-comments" style="font-size:48px;color:var(--c-border);margin-bottom:15px;"></i>
            <h3>No conversations yet</h3>
            <p style="color:#2F4156;">Start a conversation with a teammate from the <a href="teammates.html" style="color:var(--c-blue-primary);">Find Teammates</a> page.</p>
        </div>
    </div>
</main>

<script src="../js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    if (!token) return window.location.href = 'login.html';
    loadConversations();
});

function logout() { localStorage.clear(); window.location.href = '../index.html'; }

async function loadConversations() {
    const token = localStorage.getItem('token');
    try {
        const res = await fetch('/api/messages/conversations', { headers: { 'Authorization': `Bearer ${token}` } });
        const conversations = await res.json();
        const container = document.getElementById('conversationsList');
        
        if (conversations.length === 0) {
            container.innerHTML = `
                <div class="empty-messages">
                    <i class="fa-solid fa-comments" style="font-size:48px;color:var(--c-border);margin-bottom:15px;"></i>
                    <h3>No conversations yet</h3>
                    <p style="color:#2F4156;">Start a conversation with a teammate from the <a href="teammates.html" style="color:var(--c-blue-primary);">Find Teammates</a> page.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = conversations.map(c => `
            <a href="chat-detail.html?user=${c.otherUser._id}" class="conversation">
                <div class="avatar" style="width:48px;height:48px;font-size:16px;">${c.otherUser.name?.charAt(0) || 'U'}</div>
                <div class="conversation-info">
                    <h3>${c.otherUser.name}</h3>
                    <p>${c.lastMessage?.content || 'No messages yet'}</p>
                </div>
                <span class="conversation-time">${c.lastMessage ? new Date(c.lastMessage.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span>
                ${c.unreadCount > 0 ? `<span class="unread-count">${c.unreadCount}</span>` : ''}
            </a>
        `).join('');
    } catch (err) {
        console.error('Load conversations error:', err);
    }
}
</script>
</body>
</html>
