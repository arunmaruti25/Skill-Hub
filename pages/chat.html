<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <a href="dashboard.html" class="logo"><img src="../assets/logo.png" alt="Skill Hub Logo" class="brand-logo-img"> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="active"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
        <a href="admin.html" id="adminNavLink" style="display:none;"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="javascript:void(0)" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard" style="padding-bottom:16px;">
    <div class="page-head" style="margin-bottom:16px;">
        <a href="messages.html" class="outline-btn" style="padding:6px 14px;font-size:12.5px;"><i class="fa-solid fa-arrow-left"></i> All Messages</a>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar" id="partnerAvatar" style="width:44px;height:44px;font-size:16px;">U</div>
            <div style="flex:1;">
                <h3 id="partnerName" style="margin:0;font-size:16px;color:var(--c-dark);">Loading...</h3>
                <p id="partnerProfession" style="margin:0;font-size:12px;color:var(--c-text-secondary);">Direct Message</p>
            </div>
            <a href="javascript:void(0)" id="partnerProfileLink" class="outline-btn" style="padding:6px 12px;font-size:12px;"><i class="fa-solid fa-user"></i> Profile</a>
        </div>

        <div class="chat-messages" id="chatMessages">
            <p class="section-text" style="margin:auto;text-align:center;color:var(--c-text-secondary);">Loading messages...</p>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
            <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>
</main>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script>
let partnerUserId = null;
let currentUserId = null;
let messagePollInterval = null;

document.addEventListener('DOMContentLoaded', () => {
    if (!requireAuth()) return;

    const user = getAuthUser();
    currentUserId = user.id || user._id;

    const urlParams = new URLSearchParams(window.location.search);
    partnerUserId = urlParams.get('user');

    if (!partnerUserId) {
        showToast('Please select a conversation first.', 'info');
        window.location.href = 'messages.html';
        return;
    }

    loadPartnerProfile();
    loadMessages();

    // Poll for new messages every 3.5 seconds
    messagePollInterval = setInterval(loadMessages, 3500);

    const form = document.getElementById('chatForm');
    form.addEventListener('submit', sendMessage);
});

window.addEventListener('beforeunload', () => {
    if (messagePollInterval) clearInterval(messagePollInterval);
});

async function loadPartnerProfile() {
    try {
        const res = await authFetch(`/api/profile/${partnerUserId}`);
        if (res && res.ok) {
            const partner = await res.json();
            document.getElementById('partnerName').textContent = partner.name || 'User';
            document.getElementById('partnerProfession').textContent = partner.profession || 'Skill Hub Member';
            document.getElementById('partnerProfileLink').href = `user-profile.html?id=${partnerUserId}`;

            const avatar = document.getElementById('partnerAvatar');
            if (partner.profileImage) {
                avatar.innerHTML = `<img src="${partner.profileImage.startsWith('http') ? partner.profileImage : API_BASE_URL + partner.profileImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
            } else {
                avatar.textContent = (partner.name || 'U').charAt(0).toUpperCase();
            }
        }
    } catch (err) {
        console.error('loadPartnerProfile error:', err);
    }
}

async function loadMessages() {
    try {
        const res = await authFetch(`/api/messages/${currentUserId}/${partnerUserId}`);
        if (res && res.ok) {
            const messages = await res.json();
            renderMessages(messages);
        }
    } catch (err) {
        console.error('loadMessages error:', err);
    }
}

function renderMessages(messages) {
    const container = document.getElementById('chatMessages');

    if (!messages.length) {
        container.innerHTML = `
            <div style="margin:auto;text-align:center;color:var(--c-text-secondary);padding:30px;">
                <i class="fa-solid fa-comments" style="font-size:36px;color:var(--c-border);margin-bottom:10px;display:block;"></i>
                <p style="font-size:14px;font-weight:600;">No messages yet.</p>
                <small>Send a greeting to start your conversation!</small>
            </div>
        `;
        return;
    }

    const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 100;

    container.innerHTML = messages.map(m => {
        const isSent = (m.sender?._id || m.sender) === currentUserId;
        const timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

        return `
            <div class="message-row ${isSent ? 'sent' : 'received'}">
                <div class="message-bubble">
                    <div>${escapeHtml(m.message)}</div>
                    <div class="message-time">${timeStr}</div>
                </div>
            </div>
        `;
    }).join('');

    if (wasAtBottom) {
        container.scrollTop = container.scrollHeight;
    }
}

async function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';

    try {
        const res = await authFetch('/api/messages', {
            method: 'POST',
            body: JSON.stringify({
                receiver: partnerUserId,
                message
            })
        });

        if (res && res.ok) {
            loadMessages();
            const container = document.getElementById('chatMessages');
            setTimeout(() => container.scrollTop = container.scrollHeight, 100);
        } else {
            showToast('Failed to send message.', 'error');
        }
    } catch (err) {
        showToast('Network error sending message', 'error');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
