<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html" class="active"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="message-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html" class="message-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="message-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>User Profile</h1>
            <p>View teammate information and skills.</p>
        </div>
        <button class="outline-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back to Teammates</button>
    </div>

    <section class="dash-card profile-header">
        <div class="big-avatar" id="userAvatar">U</div>
        <div>
            <h2 id="userName">Loading...</h2>
            <p id="userRole">Developer</p>
            <small>Member since <span id="userJoinDate">January 2024</span></small>
        </div>
    </section>

    <section class="dash-card">
        <h2>About</h2>
        <p id="userBio" style="color:#2F4156;">No bio provided.</p>
    </section>

    <section class="dash-card">
        <div class="card-title"><h2>Skills</h2></div>
        <div class="tags" id="userSkills"></div>
    </section>

    <section class="dash-card">
        <h2>Projects</h2>
        <div id="userProjects">
            <p class="section-text">Loading...</p>
        </div>
    </section>
</main>

<script src="../js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    if (!token) return window.location.href = 'login.html';
    
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');
    if (userId) loadUserProfile(userId);
});

function logout() { localStorage.clear(); window.location.href = '../index.html'; }
function goBack() { window.history.back(); }

async function loadUserProfile(userId) {
    const token = localStorage.getItem('token');
    try {
        const res = await fetch(`${API_BASE_URL}/api/users/${userId}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const user = await res.json();
        
        document.getElementById('userName').textContent = user.name || 'User';
        document.getElementById('userRole').textContent = user.role || 'Developer';
        document.getElementById('userAvatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
        document.getElementById('userJoinDate').textContent = new Date(user.createdAt).toLocaleDateString('en-US', {month:'long',year:'numeric'});
        document.getElementById('userBio').textContent = user.bio || 'No bio provided.';
        
        const skillsContainer = document.getElementById('userSkills');
        (user.skills || []).forEach(s => {
            const span = document.createElement('span');
            span.textContent = s;
            skillsContainer.appendChild(span);
        });

        loadUserProjects(userId);
    } catch (err) {
        console.error('Load user profile error:', err);
    }
}

async function loadUserProjects(userId) {
    const token = localStorage.getItem('token');
    try {
        const res = await fetch(`${API_BASE_URL}/api/users/${userId}/projects`, { headers: { 'Authorization': `Bearer ${token}` } });
        const projects = await res.json();
        document.getElementById('userProjects').innerHTML = projects.length ? projects.map(p => `
            <div class="project">
                <div class="project-icon"><i class="fa-solid fa-code"></i></div>
                <div><h3>${p.title}</h3><p>${p.description?.substring(0,80)}...</p></div>
                <a href="project-details.html?id=${p._id}" class="view-btn">View</a>
            </div>
        `).join('') : '<p class="section-text">No projects yet.</p>';
    } catch (err) {
        console.error('Load projects error:', err);
    }
}
</script>
</body>
</html>
