<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .conversation { display: flex; align-items: center; gap: 15px; padding: 18px; border-bottom: 1px solid #eee; cursor: pointer; transition: .2s; }
        .conversation:hover { background: #f7f7fb; }
        .conversation-info { flex: 1; }
        .conversation-info h3 { margin: 0 0 5px; }
        .conversation-info p { margin: 0; color: #777; }
        .conversation-time { font-size: 12px; color: #888; }
        .unread-count { min-width: 22px; height: 22px; border-radius: 50%; background: #4560b2; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .empty-messages { text-align: center; padding: 50px 20px; color: #777; }
        .message-badge { display: none; margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #f44336; color: white; font-size: 11px; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html"><i class="fa-solid fa-paper-plane"></i> Requests</a>
        <a href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
        <a href="messages.html" class="active"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="message-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Messages</h1>
            <p>Chat with your Skill Hub teammates.</p>
        </div>
    </div>

    <section class="dash-card">
        <div id="conversationList"><p>Loading messages...</p></div>
    </section>
</main>

<script src="../js/app.js"></script>
<script>
const loggedInUser = JSON.parse(localStorage.getItem("user"));
const conversationList = document.getElementById("conversationList");
const messageBadge = document.getElementById("messageBadge");

async function loadConversations() {
    if (!loggedInUser?.id) {
        conversationList.innerHTML = '<div class="empty-messages"><h2>Please login first</h2></div>';
        return;
    }
    try {
        const res = await fetch(`${API_BASE_URL}/api/message-inbox/` + loggedInUser.id);
        const conversations = await res.json();
        if (!res.ok) throw new Error();
        displayConversations(conversations);
    } catch {
        conversationList.innerHTML = '<div class="empty-messages"><h2>Cannot load messages</h2><p>Make sure the backend is running.</p></div>';
    }
}

function displayConversations(conversations) {
    conversationList.innerHTML = "";
    if (!conversations.length) {
        conversationList.innerHTML = `
            <div class="empty-messages">
                <i class="fa-solid fa-comments" style="font-size:45px;margin-bottom:15px;"></i>
                <h2>No conversations yet</h2>
                <p>Find a teammate and send them a message.</p>
            </div>
        `;
        if (messageBadge) messageBadge.style.display = "none";
        return;
    }

    let totalUnread = 0;
    conversations.forEach(conversation => {
        totalUnread += Number(conversation.unreadCount || 0);
        const item = document.createElement("div");
        item.className = "conversation";
        item.onclick = () => window.location.href = "chat.html?user=" + conversation.user._id;

        const firstLetter = (conversation.user.name || "U").charAt(0).toUpperCase();
        const unread = conversation.unreadCount > 0 ? `<div class="unread-count">${conversation.unreadCount}</div>` : "";
        const avatarContent = conversation.user.profileImage ? `<img src="${API_BASE_URL}${conversation.user.profileImage}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.parentElement.innerHTML='${firstLetter}'">` : firstLetter;

        item.innerHTML = `
            <div class="avatar">${avatarContent}</div>
            <div class="conversation-info">
                <h3>${conversation.user.name}</h3>
                <p>${conversation.lastMessage}</p>
            </div>
            <div style="text-align:right;">
                <div class="conversation-time">${new Date(conversation.lastMessageTime).toLocaleDateString()}</div>
                <div style="margin-top:8px;display:flex;justify-content:flex-end;">${unread}</div>
            </div>
        `;
        conversationList.appendChild(item);
    });

    if (messageBadge) {
        messageBadge.textContent = totalUnread;
        messageBadge.style.display = totalUnread > 0 ? "flex" : "none";
    }
}

loadConversations();
setInterval(loadConversations, 5000);
</script>
</body>
</html>
