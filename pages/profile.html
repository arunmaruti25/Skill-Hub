<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="message-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html" class="message-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="message-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>My Profile</h1>
            <p>Manage your information and skills.</p>
        </div>
        <button class="primary-btn" onclick="saveProfile()">Save Profile</button>
    </div>

    <!-- PROFILE HEADER -->
    <section class="dash-card profile-header">
        <div>
            <div class="big-avatar" id="profileAvatar">U</div>
            <div style="display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap;">
                <label for="profileImageInput" class="primary-btn" style="padding: 7px 14px; font-size: 11.5px; cursor: pointer; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); box-shadow: none;">
                    <i class="fa-solid fa-camera"></i> Change Photo
                </label>
                <input type="file" id="profileImageInput" accept="image/*" style="display: none;">
                <button type="button" id="removeImageBtn" onclick="removeProfileImage()" class="outline-btn" style="padding: 7px 14px; font-size: 11.5px; display: none; background: rgba(239,68,68,0.2); color: #fca5a5; border-color: rgba(239,68,68,0.5);">
                    <i class="fa-solid fa-trash-can"></i> Remove Photo
                </button>
            </div>
        </div>
        <div>
            <h2 id="profileTitle">User</h2>
            <p id="profileProfession"></p>
            <small id="profileLocation">India</small>
        </div>
    </section>

    <!-- BASIC INFORMATION -->
    <section class="dash-card">
        <h2>Basic Information</h2>
        <div class="form-grid">
            <div>
                <label>Full Name</label>
                <input id="profileNameInput" type="text" placeholder="Enter your full name">
            </div>
            <div>
                <label>Profession</label>
                <input id="professionInput" type="text" placeholder="e.g. Python Developer">
            </div>
            <div>
                <label>Location</label>
                <input id="profileLocationInput" type="text" placeholder="City, Country">
            </div>
            <div class="full">
                <label>Bio</label>
                <textarea id="profileBioInput" placeholder="Tell others about yourself..."></textarea>
            </div>
        </div>
    </section>

    <!-- SKILLS -->
    <section class="dash-card">
        <h2>Skills</h2>
        <p class="section-text">Add the skills you can contribute to projects.</p>
        <div class="tags" id="profileSkills"></div>
        <input id="skillInput" type="text" placeholder="Add another skill and press Enter...">
    </section>

    <!-- EXPERIENCE -->
    <section class="dash-card">
        <h2>Experience & Availability</h2>
        <div class="form-grid">
            <div>
                <label>Experience</label>
                <select id="experienceInput">
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>
            <div>
                <label>Availability</label>
                <select id="availabilityInput">
                    <option value="Available">Available</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Weekends">Weekends</option>
                </select>
            </div>
        </div>
    </section>

    <!-- SOCIAL LINKS -->
    <section class="dash-card">
        <h2>Social Links</h2>
        <div class="form-grid">
            <div>
                <label>GitHub</label>
                <input id="githubInput" type="url" placeholder="GitHub profile">
            </div>
            <div>
                <label>LinkedIn</label>
                <input id="linkedinInput" type="url" placeholder="LinkedIn profile">
            </div>
        </div>
    </section>
</main>

<script src="../js/app.js"></script>
</body>
</html>
