<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="message-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html" class="message-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="message-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>My Profile</h1>
            <p>Manage your information and skills.</p>
        </div>
        <button class="primary-btn" onclick="saveProfile()">Save Profile</button>
    </div>

    <section class="dash-card profile-header">
        <div class="big-avatar" id="profileAvatar">JD</div>
        <div>
            <h2 id="profileName">John Doe</h2>
            <p id="profileRole">Full Stack Developer</p>
            <small>Member since <span id="joinDate">January 2024</span></small>
        </div>
    </section>

    <section class="dash-card">
        <h2>Personal Information</h2>
        <div class="form-grid">
            <label>Full Name</label>
            <label>Email</label>
            <input type="text" id="editName" placeholder="Your name">
            <input type="email" id="editEmail" placeholder="your@email.com">
            <label class="full">Bio</label>
            <textarea id="editBio" class="full" placeholder="Tell others about yourself..." style="grid-column: 1 / -1;"></textarea>
        </div>
    </section>

    <section class="dash-card">
        <h2>Skills</h2>
        <div class="tags" id="skillsTags"></div>
        <div style="display:flex;gap:10px;margin-top:15px;">
            <input type="text" id="skillInput" placeholder="Add a skill" style="flex:1;">
            <button class="primary-btn" onclick="addSkill()">Add</button>
        </div>
    </section>

    <section class="dash-card">
        <h2>Your Projects</h2>
        <div id="userProjects">
            <p class="section-text">Loading...</p>
        </div>
    </section>
</main>

<script src="../js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) return window.location.href = 'login.html';
    loadProfile(user);
});

function logout() { localStorage.clear(); window.location.href = '../index.html'; }

function loadProfile(user) {
    document.getElementById('profileName').textContent = user.name || 'User';
    document.getElementById('profileRole').textContent = user.role || 'Developer';
    document.getElementById('profileAvatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
    
    const joinDateEl = document.getElementById('joinDate');
    if (joinDateEl) {
        joinDateEl.textContent = user.createdAt 
            ? new Date(user.createdAt).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
            : 'Recently';
    }
    
    document.getElementById('editName').value = user.name || '';
    document.getElementById('editEmail').value = user.email || '';
    document.getElementById('editBio').value = user.bio || '';
    
    const skillsContainer = document.getElementById('skillsTags');
    (user.skills || []).forEach(s => addSkillTag(s, skillsContainer));
}

function addSkillTag(skill, container) {
    const span = document.createElement('span');
    span.innerHTML = `${skill} <i class="fa-solid fa-xmark" onclick="removeSkill(this,'${skill}')" style="cursor:pointer;margin-left:4px;"></i>`;
    container.appendChild(span);
}

function addSkill() {
    const input = document.getElementById('skillInput');
    const skill = input.value.trim();
    if (!skill) return;
    const container = document.getElementById('skillsTags');
    if ([...container.children].some(c => c.textContent.includes(skill))) return;
    addSkillTag(skill, container);
    input.value = '';
}

function removeSkill(el, skill) {
    el.parentElement.remove();
}

async function saveProfile() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const skills = [...document.querySelectorAll('#skillsTags span')].map(s => s.textContent.replace('×','').trim());
    
    const data = {
        name: document.getElementById('editName').value,
        email: document.getElementById('editEmail').value,
        bio: document.getElementById('editBio').value,
        skills
    };

    try {
        const res = await fetch(`${API_BASE_URL}/api/users/${user._id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(data)
        });
        if (res.ok) {
            const updated = await res.json();
            localStorage.setItem('user', JSON.stringify(updated));
            alert('Profile saved!');
            loadProfile(updated);
        } else alert('Failed to save');
    } catch (err) {
        alert('Network error');
    }
}

async function loadUserProjects() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    try {
        const res = await fetch(`${API_BASE_URL}/api/users/${user._id}/projects`, { headers: { 'Authorization': `Bearer ${token}` } });
        const projects = await res.json();
        document.getElementById('userProjects').innerHTML = projects.length ? projects.map(p => `
            <div class="project">
                <div class="project-icon"><i class="fa-solid fa-code"></i></div>
                <div><h3>${p.title}</h3><p>${p.description?.substring(0,80)}...</p></div>
                <a href="project-details.html?id=${p._id}" class="view-btn">View</a>
            </div>
        `).join('') : '<p class="section-text">No projects yet.</p>';
    } catch (err) {
        console.error('Load projects error:', err);
    }
}
loadUserProjects();
</script>
</body>
</html>
