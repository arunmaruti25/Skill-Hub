<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-box">
        <a href="../index.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
        <h1>Welcome Back</h1>
        <p>Sign in to your account to continue</p>
        
        <form id="loginForm">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required autocomplete="email">
            
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <label for="loginPassword">Password</label>
                <a href="forgot-password.html" style="font-size:12px;color:var(--c-primary);font-weight:600;">Forgot?</a>
            </div>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="toggle-password-btn" onclick="togglePassword('loginPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            
            <button type="submit" class="primary-btn" style="width:100%;height:46px;margin-top:4px;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <!-- Shown when server returns needsVerification: true -->
        <div id="verifyBanner" style="display:none;margin-top:16px;background:#FFF8E6;border:1px solid #F59E0B;border-radius:12px;padding:14px 18px;">
            <p style="color:#92400E;font-size:13px;margin:0 0 10px;"><i class="fa-solid fa-triangle-exclamation"></i> <strong>Email not verified.</strong> Check your inbox for a verification link.</p>
            <button onclick="resendVerification()" class="outline-btn" style="font-size:12px;padding:7px 14px;border-color:#F59E0B;color:#92400E;">
                <i class="fa-solid fa-rotate-right"></i> Resend Verification Email
            </button>
        </div>
        
        <p class="auth-link">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
</div>

<div id="toast-container"></div>

<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
let pendingVerifyEmail = "";

document.addEventListener("DOMContentLoaded", () => {
    if (getAuthToken() && getAuthUser()?.name) {
        window.location.href = "dashboard.html";
        return;
    }

    const form = document.getElementById("loginForm");
    form?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button[type='submit']");
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';
        btn.disabled = true;

        const email = document.getElementById("loginEmail").value.trim().toLowerCase();
        const password = document.getElementById("loginPassword").value;

        try {
            const res = await fetch(`${API_BASE_URL}/api/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const result = await res.json();

            if (res.ok && result.token) {
                setAuthSession(result.token, result.user);
                showToast("Welcome back!", "success");
                setTimeout(() => window.location.href = "dashboard.html", 400);
            } else if (result.needsVerification) {
                pendingVerifyEmail = result.email || email;
                document.getElementById("verifyBanner").style.display = "block";
                showToast("Please verify your email before signing in.", "warning");
            } else {
                showToast(result.message || "Invalid email or password", "error");
            }
        } catch (err) {
            showToast("Network error. Please try again.", "error");
        } finally {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    });
});

async function resendVerification() {
    const email = pendingVerifyEmail || document.getElementById("loginEmail").value.trim().toLowerCase();
    if (!email) return showToast("Please enter your email first.", "warning");

    try {
        const res = await fetch(`${API_BASE_URL}/api/auth/resend-verification`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        const result = await res.json();
        showToast(result.message, res.ok ? "success" : "error");
    } catch {
        showToast("Network error. Please try again.", "error");
    }
}
</script>
</body>
</html>
