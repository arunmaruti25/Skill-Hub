<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .notification-actions { display: flex; gap: 10px; margin-top: 15px; }
        .accept-btn, .reject-btn { padding: 10px 18px; border-radius: 7px; cursor: pointer; }
        .accept-btn { background: #4560b2; color: white; border: none; }
        .reject-btn { background: white; color: #4560b2; border: 1px solid #4560b2; }
        .accept-btn:hover, .reject-btn:hover { opacity: .85; }
        .notification-message { font-size: 16px; margin-top: 10px; }
        .notification-time { font-size: 13px; color: #777; margin-top: 5px; }
        .empty-notifications { text-align: center; padding: 40px; color: #777; }
        .sidebar-badge-link { display: flex !important; align-items: center; }
        .sidebar-badge { display: none; margin-left: auto; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 50%; background: #f44336; color: white; font-size: 12px; font-weight: bold; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html"><i class="fa-solid fa-paper-plane"></i> Requests</a>
        <a href="notifications.html" class="active sidebar-badge-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="sidebar-badge-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Notifications</h1>
            <p>Stay updated about your projects and requests.</p>
        </div>
        <button class="primary-btn" onclick="markAllRead()"><i class="fa-solid fa-check-double"></i> Mark All as Read</button>
    </div>

    <section class="dash-card">
        <div id="notificationsContainer"><p>Loading notifications...</p></div>
    </section>
</main>

<script src="../js/app.js"></script>
<script>
const loggedInUser = JSON.parse(localStorage.getItem("user"));
const container = document.getElementById("notificationsContainer");

async function loadNotifications() {
    if (!loggedInUser?.id) {
        container.innerHTML = '<div class="empty-notifications"><h2>Please login first</h2></div>';
        return;
    }
    try {
        const res = await fetch(`${API_BASE_URL}/api/notifications/` + loggedInUser.id);
        const notifications = await res.json();
        if (!res.ok) throw new Error();

        updateNotificationBadge(notifications);
        displayNotifications(notifications);
    } catch {
        container.innerHTML = '<div class="empty-notifications"><h2>Cannot connect to server</h2><p>Make sure the backend is running.</p></div>';
    }
}

function displayNotifications(notifications) {
    if (!notifications.length) {
        container.innerHTML = `
            <div class="empty-notifications">
                <i class="fa-solid fa-bell-slash" style="font-size:40px;"></i>
                <h2>No notifications</h2>
                <p>You're all caught up!</p>
            </div>
        `;
        return;
    }

    container.innerHTML = "";
    notifications.forEach(n => {
        const card = document.createElement("div");
        card.style = `border: 1px solid #b5c2e8; border-radius: 12px; padding: 20px; margin-bottom: 15px; background: ${n.read ? "#ffffff" : "#f8f7ff"};`;
        const date = new Date(n.createdAt);

        let actions = "";
        if (n.type === "project_invite" && !n.read) {
            actions = `
                <div class="notification-actions">
                    <button class="accept-btn" onclick="acceptInvitation('${n._id}')"><i class="fa-solid fa-check"></i> Accept Invitation</button>
                    <button class="reject-btn" onclick="rejectInvitation('${n._id}')"><i class="fa-solid fa-xmark"></i> Reject</button>
                </div>
            `;
        }

        card.innerHTML = `
            <div style="display:flex; gap:15px; align-items:flex-start;">
                <div class="project-icon"><i class="fa-solid fa-bell"></i></div>
                <div style="flex:1;">
                    <div class="notification-message">${n.message}</div>
                    <div class="notification-time">${date.toLocaleString()}</div>
                    ${actions}
                    ${n.read ? '<span style="display:inline-block; margin-top:12px; font-size:13px; color:#777;"><i class="fa-solid fa-check"></i> Read</span>' : ""}
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function updateNotificationBadge(notifications) {
    const unreadCount = notifications.filter(n => !n.read).length;
    const badge = document.getElementById("notificationBadge");
    if (!badge) return;
    badge.textContent = unreadCount;
    badge.style.display = unreadCount > 0 ? "flex" : "none";
}

async function acceptInvitation(notificationId) {
    try {
        const res = await fetch(`${API_BASE_URL}/api/notifications/${notificationId}/accept-invite`, { method: "PUT" });
        const result = await res.json();
        if (!res.ok) return alert(result.message || "Could not accept invitation.");
        alert("Invitation accepted! You are now a member of the project.");
        loadNotifications();
    } catch {
        alert("Cannot connect to server.");
    }
}

async function rejectInvitation(notificationId) {
    try {
        const res = await fetch(`${API_BASE_URL}/api/notifications/${notificationId}/reject-invite`, { method: "PUT" });
        const result = await res.json();
        if (!res.ok) return alert(result.message || "Could not reject invitation.");
        alert("Invitation rejected.");
        loadNotifications();
    } catch {
        alert("Cannot connect to server.");
    }
}

async function markAllRead() {
    if (!loggedInUser?.id) return;
    try {
        const res = await fetch(`${API_BASE_URL}/api/notifications/read-all/` + loggedInUser.id, { method: "PUT" });
        if (res.ok) loadNotifications();
    } catch (err) {
        console.error(err);
    }
}

loadNotifications();
setInterval(loadNotifications, 5000);
</script>
</body>
</html>
