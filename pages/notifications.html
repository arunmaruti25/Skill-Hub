<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
:root {
        --c-white:       #FFFFFF;
        --c-bg-light:    #EAF6FF;
        --c-border:      #C1E5FF;
        --c-sky-mid:     #9CD5FF;
        --c-blue-primary:#6AB0E3;
        --c-text-dark:   #001D39;
        --c-error: #ef4444;
        --c-success: #22c55e;
        --c-warning: #f59e0b;
    }
    .notification-actions { display: flex; gap: 10px; margin-top: 15px; }
    .accept-btn, .reject-btn { padding: 10px 18px; border-radius: 7px; cursor: pointer; font-weight: 600; }
    .accept-btn { background: var(--c-blue-primary); color: var(--c-white); border: none; }
    .reject-btn { background: transparent; color: var(--c-blue-primary); border: 1px solid var(--c-blue-primary); }
    .accept-btn:hover, .reject-btn:hover { opacity: .85; transform: translateY(-2px); }
    .notification-message { font-size: 16px; margin-top: 10px; color: #2F4156; }
    .notification-time { font-size: 13px; color: #2F4156; margin-top: 5px; }
    .empty-notifications { text-align: center; padding: 40px; color: #2F4156; }
    .sidebar-badge-link { display: flex !important; align-items: center; }
    .sidebar-badge { margin-left: auto; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 50%; background: var(--c-error); color: white; font-size: 12px; font-weight: bold; display: none; align-items: center; justify-content: center; }
    .notification-card {
        border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 15px;
        background: var(--card-bg);
    }
    .notification-card.unread { background: rgba(106,176,227,0.05); border-color: var(--c-blue-primary); }
    .project-name { font-weight: 700; color: #001D39; margin-bottom: 5px; }
    .requester-name { color: #2F4156; font-size: 14px; }
</style>
</head>
<body>
<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="sidebar-badge-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html" class="active sidebar-badge-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="sidebar-badge-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Notifications</h1>
            <p>Stay updated with your project activities</p>
        </div>
    </div>

    <div id="notificationsList">
        <div class="empty-notifications">
            <i class="fa-solid fa-bell-slash" style="font-size:48px;color:var(--c-border);margin-bottom:15px;"></i>
            <h3>No notifications</h3>
            <p>You're all caught up!</p>
        </div>
    </div>
</main>

<script src="../js/auth.js"></script>
<script>
const API_BASE_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:5000"
    : "https://skill-hub-backend-4w35.onrender.com";

document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    if (!token) return window.location.href = 'login.html';
    loadNotifications();
});

function logout() { localStorage.clear(); window.location.href = '../index.html'; }

async function loadNotifications() {
    const token = localStorage.getItem('token');
    try {
        const res = await fetch(`${API_BASE_URL}/api/notifications`, { headers: { 'Authorization': `Bearer ${token}` } });
        const notifications = await res.json();
        const container = document.getElementById('notificationsList');
        
        if (notifications.length === 0) return;
        
        container.innerHTML = notifications.map(n => `
            <div class="notification-card ${n.read ? '' : 'unread'}">
                <div class="project-name">${n.projectTitle || 'Project Update'}</div>
                <div class="notification-message">${n.message}</div>
                <div class="notification-time">${new Date(n.createdAt).toLocaleString()}</div>
                ${n.type === 'join_request' && n.status === 'pending' ? `
                    <div class="notification-actions">
                        <button class="accept-btn" onclick="handleRequest('${n._id}', 'accepted')"><i class="fa-solid fa-check"></i> Accept</button>
                        <button class="reject-btn" onclick="handleRequest('${n._id}', 'rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
                    </div>
                ` : ''}
            </div>
        `).join('');
        
        const unreadCount = notifications.filter(n => !n.read).length;
        document.getElementById('notificationBadge').textContent = unreadCount;
        document.getElementById('notificationBadge').style.display = unreadCount ? 'flex' : 'none';
    } catch (err) {
        console.error('Load notifications error:', err);
    }
}

async function handleRequest(id, action) {
    const token = localStorage.getItem('token');
    try {
        await fetch(`${API_BASE_URL}/api/requests/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ status: action })
        });
        loadNotifications();
    } catch (err) {
        console.error('Handle request error:', err);
    }
}
</script>
</body>
</html>
