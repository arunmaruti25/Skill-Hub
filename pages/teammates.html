<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Teammates - Skill Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <a href="dashboard.html" class="logo"><i class="fa-solid fa-users"></i> Skill Hub</a>
    <nav>
        <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="teammates.html" class="active"><i class="fa-solid fa-user-group"></i> Find Teammates</a>
        <a href="projects.html"><i class="fa-solid fa-folder"></i> Projects</a>
        <a href="requests.html" class="message-link"><i class="fa-solid fa-paper-plane"></i> Requests<span id="requestBadge" class="sidebar-badge">0</span></a>
        <a href="notifications.html" class="message-link"><i class="fa-solid fa-bell"></i> Notifications<span id="notificationBadge" class="sidebar-badge">0</span></a>
        <a href="messages.html" class="message-link"><i class="fa-solid fa-message"></i> Messages<span id="messageBadge" class="sidebar-badge">0</span></a>
    </nav>
    <div class="sidebar-bottom">
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a>
        <a href="../index.html" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
</aside>

<main class="dashboard">
    <div class="page-head">
        <div>
            <h1>Find Teammates</h1>
            <p>Find people with the skills you need.</p>
        </div>
    </div>

    <div class="dashboard-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="teammateSearch" placeholder="Search by name, skill, or bio..." oninput="filterTeammates()">
    </div>

    <div class="filters">
        <select id="skillFilterTeammates"><option value="">All Skills</option></select>
    </div>

    <div id="teammatesGrid" class="people">
        <p class="section-text" style="grid-column:1/-1;text-align:center;">Loading teammates...</p>
    </div>
</main>

<script src="../js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('token');
    if (!token) return window.location.href = 'login.html';
    loadTeammates();
    loadSkillFilter();
});

function logout() { localStorage.clear(); window.location.href = '../index.html'; }

async function loadTeammates() {
    const token = localStorage.getItem('token');
    try {
        const res = await fetch('/api/users/teammates', { headers: { 'Authorization': `Bearer ${token}` } });
        const teammates = await res.json();
        renderTeammates(teammates);
    } catch (err) {
        console.error('Load teammates error:', err);
    }
}

function renderTeammates(teammates) {
    const container = document.getElementById('teammatesGrid');
    if (!teammates.length) {
        container.innerHTML = '<p class="section-text" style="grid-column:1/-1;text-align:center;">No teammates found.</p>';
        return;
    }
    container.innerHTML = teammates.map(t => `
        <div class="person">
            <div class="avatar">${t.name?.charAt(0) || 'U'}</div>
            <h3>${t.name}</h3>
            <p>${t.role || 'Developer'}</p>
            <div class="tags" style="justify-content:center;">
                ${(t.skills || []).slice(0, 4).map(s => `<span>${s}</span>`).join('')}
            </div>
            <button class="primary-btn" onclick="viewProfile('${t._id}')"><i class="fa-solid fa-user"></i> View Profile</button>
        </div>
    `).join('');
}

async function loadSkillFilter() {
    const token = localStorage.getItem('token');
    try {
        const res = await fetch('/api/skills', { headers: { 'Authorization': `Bearer ${token}` } });
        const skills = await res.json();
        const select = document.getElementById('skillFilterTeammates');
        skills.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            select.appendChild(opt);
        });
    } catch (err) { console.error('Load skills error:', err); }
}

function filterTeammates() {
    const search = document.getElementById('teammateSearch').value.toLowerCase();
    const skill = document.getElementById('skillFilterTeammates').value;
    const cards = document.querySelectorAll('#teammatesGrid .person');
    
    cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        const matchesSearch = !search || text.includes(search);
        const matchesSkill = !skill || text.includes(skill.toLowerCase());
        card.style.display = (matchesSearch && matchesSkill) ? 'block' : 'none';
    });
}

function viewProfile(userId) {
    window.location.href = `user-profile.html?id=${userId}`;
}
</script>
</body>
</html>
